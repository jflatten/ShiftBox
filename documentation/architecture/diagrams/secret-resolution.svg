<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="850" viewBox="0 0 1310 850" role="img" aria-labelledby="title desc"><title id="title">Effective secret lookup • exactly three scopes</title><desc id="desc">Controller resolves owner-authorized user, project and organization secrets by key. A workspace is identity context, not a storage scope.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#496B88"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="28" y="36" text-anchor="start" fill="#17324D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Effective secret lookup • exactly three scopes</text>
<rect x="25" y="100" width="300" height="145" rx="12" fill="#EAF3FC" stroke="#496B88" stroke-width="1.6"/>
<text x="39" y="128" text-anchor="start" fill="#17324D" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Workspace request</text>
<text x="39" y="153" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">shiftbox secrets get-secret KEY</text>
<text x="39" y="173" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Controller derives recorded</text>
<text x="39" y="193" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">owner/project; admin connection</text>
<text x="39" y="213" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">does not change it</text>
<rect x="390" y="100" width="260" height="145" rx="12" fill="#EAF6F0" stroke="#496B88" stroke-width="1.6"/>
<text x="404" y="128" text-anchor="start" fill="#17324D" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">1  User value</text>
<text x="404" y="153" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Highest priority; explicit</text>
<text x="404" y="173" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">empty value counts as present</text>
<rect x="710" y="100" width="260" height="145" rx="12" fill="#EAF6F0" stroke="#496B88" stroke-width="1.6"/>
<text x="724" y="128" text-anchor="start" fill="#17324D" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">2  Project Template</text>
<text x="724" y="153" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Only if current template</text>
<text x="724" y="173" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">access permits it</text>
<rect x="1030" y="100" width="255" height="145" rx="12" fill="#EAF6F0" stroke="#496B88" stroke-width="1.6"/>
<text x="1044" y="128" text-anchor="start" fill="#17324D" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">3  Organization</text>
<text x="1044" y="153" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Available to authorized</text>
<text x="1044" y="173" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">organization members</text>
<polyline points="325,172 390,172" fill="none" stroke="#496B88" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="650,172 710,172" fill="none" stroke="#496B88" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="651.1" y="142" width="57.8" height="22" rx="3" fill="white"/>
<text x="680" y="157" text-anchor="middle" fill="#17324D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Absent</text>
<polyline points="970,172 1030,172" fill="none" stroke="#496B88" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="971.1" y="142" width="57.8" height="22" rx="3" fill="white"/>
<text x="1000" y="157" text-anchor="middle" fill="#17324D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Absent</text>
<rect x="390" y="345" width="580" height="125" rx="12" fill="#EAF3FC" stroke="#496B88" stroke-width="1.6"/>
<text x="404" y="373" text-anchor="start" fill="#17324D" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Return first authorized present value</text>
<text x="404" y="398" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">No match → clear failure. Values stay out of management redisplay and</text>
<text x="404" y="418" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">diagnostics.</text>
<polyline points="520,245 520,345" fill="none" stroke="#496B88" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="494.75" y="285" width="50.5" height="22" rx="3" fill="white"/>
<text x="520" y="300" text-anchor="middle" fill="#17324D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Found</text>
<polyline points="840,245 840,345" fill="none" stroke="#496B88" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="814.75" y="285" width="50.5" height="22" rx="3" fill="white"/>
<text x="840" y="300" text-anchor="middle" fill="#17324D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Found</text>
<polyline points="1155,245 1155,405 970,405" fill="none" stroke="#496B88" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1074.75" y="375" width="50.5" height="22" rx="3" fill="white"/>
<text x="1100" y="390" text-anchor="middle" fill="#17324D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Found</text>
<rect x="25" y="550" width="600" height="165" rx="12" fill="#FFF4DD" stroke="#496B88" stroke-width="1.6"/>
<text x="39" y="578" text-anchor="start" fill="#17324D" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Revocation and deletion</text>
<text x="39" y="603" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Removing a higher value reveals the next authorized value. Revoking</text>
<text x="39" y="623" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">project access removes that source immediately. Already copied values</text>
<text x="39" y="643" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">cannot be recalled.</text>
<rect x="685" y="550" width="600" height="165" rx="12" fill="#FCEDEE" stroke="#496B88" stroke-width="1.6"/>
<text x="699" y="578" text-anchor="start" fill="#17324D" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Explicit trust boundary</text>
<text x="699" y="603" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Any code in this VM may request every effective authorized value, not</text>
<text x="699" y="623" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">only injected bindings. Root keys, provider credentials and OAuth</text>
<text x="699" y="643" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">refresh tokens are excluded.</text>
<text x="28" y="832" text-anchor="start" fill="#52677B" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">ShiftBox design • November 2026 • Intended contracts; implementation validation required</text>
</svg>