<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1030" viewBox="0 0 1450 1030" role="img" aria-labelledby="title desc"><title id="title">Workspace communication paths</title><desc id="desc">Requests flow from browser to controller and from guest to controller; provisioning goes through the trusted provider host.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#496B88"/></marker></defs><rect width="100%" height="100%" fill="white"/>
