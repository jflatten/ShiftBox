# Protects an existing installation when a stack is updated or deleted.
- name: The encrypted installation volume with retention is accepted
  input:
    Resources:
      InstallationVolume:
        Type: AWS::EC2::Volume
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
          Encrypted: true
  expectations:
    rules:
      retained_volume: PASS

# A replacement must never implicitly delete the old installation.
- name: Missing update replacement retention fails
  input:
    Resources:
      InstallationVolume:
        Type: AWS::EC2::Volume
        DeletionPolicy: Retain
        Properties:
          Encrypted: true
  expectations:
    rules:
      retained_volume: FAIL

# The cache is encrypted but can be deleted with its stack.
- name: The cache volume can be deleted
  input:
    Resources:
      RegistryCacheVolume:
        Type: AWS::EC2::Volume
        DeletionPolicy: Delete
        UpdateReplacePolicy: Delete
        Properties:
          Encrypted: true
  expectations:
    rules:
      disposable_cache_volume: PASS

# The cache carries registry content and still needs encryption at rest.
- name: An unencrypted cache volume is rejected
  input:
    Resources:
      RegistryCacheVolume:
        Type: AWS::EC2::Volume
        DeletionPolicy: Delete
        UpdateReplacePolicy: Delete
        Properties:
          Encrypted: false
  expectations:
    rules:
      disposable_cache_volume: FAIL

# Encryption is mandatory even when other data protections are configured.
- name: An unencrypted installation volume is rejected
  input:
    Resources:
      InstallationVolume:
        Type: AWS::EC2::Volume
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
          Encrypted: false
  expectations:
    rules:
      retained_volume: FAIL

# Password and TLS material remain retrievable after a reviewed stack deletion.
- name: Managed secrets must be retained
  input:
    Resources:
      PostgresTlsSecret:
        Type: AWS::SecretsManager::Secret
        DeletionPolicy: Retain
  expectations:
    rules:
      retained_secrets: FAIL

# Fresh creation starts the claim-protected first-login service.
- name: An operator-selected phase is rejected as the default
  input:
    Parameters:
      Phase:
        Default: active
  expectations:
    rules:
      first_login_startup: FAIL

# The canonical stack starts the protected browser setup without a separate setup task.
- name: Canonical launch starts with the first-login command
  input:
    Parameters:
      ReleasePins:
        Type: String
    Resources:
      ControllerTask:
        Properties:
          ContainerDefinitions:
            - Command: [one-pass]
  expectations:
    rules:
      canonical_first_login_startup: PASS

# Starting the controller directly would skip the intended first-login bootstrap.
- name: Canonical launch rejects the regular serve command
  input:
    Parameters:
      ReleasePins:
        Type: String
    Resources:
      ControllerTask:
        Properties:
          ContainerDefinitions:
            - Command: [serve]
  expectations:
    rules:
      canonical_first_login_startup: FAIL

# A role created by the public template needs a name, path and permissions ceiling.
- name: A named role with a permissions boundary is accepted
  input:
    Resources:
      HostRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: {Ref: RoleName}
          Path: /shiftbox/
          PermissionsBoundary: {Ref: HostRoleBoundary}
  expectations:
    rules:
      bounded_runtime_roles: PASS

# Failing to set a boundary can let later policies expand a runtime identity.
- name: A named role without a permissions boundary is rejected
  input:
    Resources:
      HostRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: {Ref: RoleName}
          Path: /shiftbox/
  expectations:
    rules:
      bounded_runtime_roles: FAIL

# Browser ingress rejects the universal IPv4 prefix.
- name: Public ingress into the private browser port fails
  input:
    Resources:
      OperatorIngress:
        Type: AWS::EC2::SecurityGroupIngress
        Properties:
          CidrIp: 0.0.0.0/0
          FromPort: 8443
          ToPort: 8443
  expectations:
    rules:
      no_public_ingress: FAIL

# OperatorCidr is the one source reference validated by the template's own parameter rules.
- name: An approved private operator reference is accepted
  input:
    Resources:
      OperatorIngress:
        Type: AWS::EC2::SecurityGroupIngress
        Properties:
          CidrIp: {Ref: OperatorCidr}
          FromPort: 8443
          ToPort: 8443
  expectations:
    rules:
      no_public_ingress: PASS

# An arbitrary dynamic reference has no validated private CIDR source.
- name: An unvalidated ingress reference fails
  input:
    Resources:
      OperatorIngress:
        Type: AWS::EC2::SecurityGroupIngress
        Properties:
          CidrIp: {Ref: ArbitraryCidr}
          FromPort: 8443
          ToPort: 8443
  expectations:
    rules:
      no_public_ingress: FAIL
