AWSTemplateFormatVersion: '2010-09-09'

Description: ShiftBox AWS deployment. Create one stack and finish setup in the browser.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  AWS::CloudFormation::Interface:
    ParameterLabels:
      OperatorCidr:
        default: Private browser source IPv4 range
      OciImageCacheSizeGiB:
        default: OCI image cache size (GiB)
      ServiceSubnet:
        default: Service subnet
      WorkspaceSubnet:
        default: Workspace subnet
      DnsSuffix:
        default: Private DNS suffix
      BrowserAccess:
        default: Browser access
      DnsPlacement:
        default: DNS placement
      PublicDnsZone:
        default: Public Route 53 hosted zone
      PublicIngressCidr:
        default: Public browser source IPv4 range
      AcmeContactEmail:
        default: Let's Encrypt contact email
      AcmeTermsAccepted:
        default: Accept Let's Encrypt subscriber agreement
      ReleasePins:
        default: Release inputs
    ParameterGroups:
    - Label:
        default: Network
      Parameters: [ServiceSubnet, WorkspaceSubnet]
    - Label:
        default: Browser access
      Parameters: [BrowserAccess, PublicDnsZone, PublicIngressCidr, AcmeContactEmail, AcmeTermsAccepted]
    - Label:
        default: Advanced
      Parameters: [DnsPlacement, OperatorCidr, DnsSuffix, DataVolumeSizeGiB, OciImageCacheSizeGiB]
    - Label:
        default: Release
      Parameters: [ReleasePins]
  com.aws.cloudformation.Context:
    arch: Standalone ShiftBox stack with managed HTTPS and an opt-in public endpoint.
    must:
    - Use the unchanged release template and its verified regional launch inputs.
    - Create the stack once and complete first login in ShiftBox.

Parameters:
  ServiceSubnet:
    Type: AWS::EC2::Subnet::Id
    Description: Existing private subnet for the ECS host, controller, PostgreSQL and setup.
  WorkspaceSubnet:
    Type: AWS::EC2::Subnet::Id
    Description: Existing private subnet for workspace instances in the same VPC.
  DnsSuffix:
    Type: String
    MaxLength: 200
    AllowedPattern: (|([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)
    Description: Leave blank to use the stack name followed by .internal.
    Default: ''
  OperatorCidr:
    Type: String
    Default: ''
    AllowedPattern: (|([0-9]{1,3}\.){3}[0-9]{1,3}/([1-9]|[12][0-9]|3[0-2]))
    Description: IPv4 range allowed to reach ShiftBox over private HTTPS on port 443. Use /32 for one address.
      Required for Private browser access and optional for Public.
  DataVolumeSizeGiB:
    Type: Number
    Default: 32
    MinValue: 20
    MaxValue: 16384
    Description: Size of the retained encrypted installation and database volume.
  OciImageCacheSizeGiB:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 16384
    Description: Size of the shared OCI image cache volume in whole GiB. Start with 20 GiB for up to 5 active users,
      50 GiB for 6 to 20, or 100 GiB for 21 to 50. Allow more for larger teams or many large, distinct devcontainer images.
      For a larger disk, review the storage budget under Administration > Infrastructure > Cache.
  PublicIngressCidr:
    Type: String
    Default: ''
    AllowedPattern: (|((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/([0-9]|[12][0-9]|3[0-2]))
    Description: Explicit IPv4 CIDR allowed to reach public HTTPS. Use your operator IP with /32 to limit access.
  AcmeContactEmail:
    Type: String
    Default: ''
    MaxLength: 254
    AllowedPattern: (|[A-Za-z0-9._+%-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})
    Description: Contact email for the Let's Encrypt account.
  AcmeTermsAccepted:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Accept the current Let's Encrypt subscriber agreement to enable managed issuance.
  BrowserAccess:
    Type: String
    AllowedValues: [Public, Private]
    Default: Private
    Description: Choose Public to enable an internet-facing endpoint. Private keeps the same domain accessible through
      the VPC.
  PublicDnsZone:
    Type: AWS::Route53::HostedZone::Id
    Description: Select the authoritative public Route 53 hosted zone in this account.
  DnsPlacement:
    Type: String
    AllowedValues: [Use selected zone, Delegate a child zone]
    Default: Use selected zone
    Description: The stack can delegate a new child zone under the selected zone.
  ReleasePins:
    Type: String
    MinLength: 1
    MaxLength: 4096
    Description: Verified image and provenance inputs for this region. The release launch link prefills this value.

Rules:
  SameVpc:
    Assertions:
    - Assert:
        Fn::EachMemberEquals:
        - - Fn::ValueOf: [WorkspaceSubnet, VpcId]
        - Fn::ValueOf: [ServiceSubnet, VpcId]
      AssertDescription: Select service and workspace subnets from the same VPC.
  AcmeContactEmailRequired:
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - {Ref: AcmeContactEmail}
          - ''
      AssertDescription: Enter a Let's Encrypt contact email.
  AcmeTermsAcceptedRequired:
    Assertions:
    - Assert:
        Fn::Equals:
        - {Ref: AcmeTermsAccepted}
        - 'true'
      AssertDescription: Accept the Let's Encrypt subscriber agreement.
  PublicSourceRequired:
    RuleCondition:
      Fn::Equals:
      - {Ref: BrowserAccess}
      - Public
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - {Ref: PublicIngressCidr}
          - ''
      AssertDescription: Enter an allowed public browser source IPv4 range.
  PrivateSourceRequired:
    RuleCondition:
      Fn::Equals:
      - {Ref: BrowserAccess}
      - Private
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - {Ref: OperatorCidr}
          - ''
      AssertDescription: Enter an allowed private browser source IPv4 range.

Conditions:
  PrivateTestArtifacts:
    Fn::And:
    - Fn::Equals: [{Ref: 'AWS::AccountId'}, '888293065132']
    - Fn::Equals: [{Ref: 'AWS::Region'}, us-east-2]
    - Fn::Equals: [{Ref: 'AWS::StackName'}, sbtest-main]
  PublicEnabled:
    Fn::Equals:
    - {Ref: BrowserAccess}
    - Public
  CreateManagedPublicZone:
    Fn::Equals:
    - {Ref: DnsPlacement}
    - Delegate a child zone
  AllowOperatorIngress:
    Fn::Not:
    - Fn::Equals:
      - {Ref: OperatorCidr}
      - ''

Resources:
  HostGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private ECS host with outbound access and no ingress
      VpcId: {'Fn::GetAtt': [LaunchDiscovery, VpcId]}
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  ControllerGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Controller entry for approved operators and the workspace subnet
      VpcId: {'Fn::GetAtt': [LaunchDiscovery, VpcId]}
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  WorkspaceGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private workspaces with outbound access and no ingress
      VpcId: {'Fn::GetAtt': [LaunchDiscovery, VpcId]}
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  PostgresGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL reachable only from controller and setup tasks
      VpcId: {'Fn::GetAtt': [LaunchDiscovery, VpcId]}
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  OperatorIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: AllowOperatorIngress
    Properties:
      GroupId: {Ref: ControllerGroup}
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: {Ref: OperatorCidr}
  PublicIngressGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: PublicEnabled
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
      com.aws.cloudformation.Context:
        why: Limit the public entry point to the operator-selected source and controller HTTPS.
    Properties:
      GroupDescription: Public ShiftBox browser HTTPS
      VpcId: {'Fn::GetAtt': [LaunchDiscovery, VpcId]}
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: {Ref: PublicIngressCidr}
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        DestinationSecurityGroupId: {Ref: ControllerGroup}
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  ControllerPublicIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: PublicEnabled
    Properties:
      GroupId: {Ref: ControllerGroup}
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: {Ref: PublicIngressGroup}
  PublicAddress:
    Type: AWS::EC2::EIP
    Condition: PublicEnabled
    Properties:
      Domain: vpc
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  PublicLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: PublicEnabled
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
      com.aws.cloudformation.Context:
        why: Give browser traffic a public IPv4 address independent of ECS task replacement.
        must: [Terminate browser TLS at the controller.]
    Properties:
      Type: network
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
      - {Ref: PublicIngressGroup}
      SubnetMappings:
      - SubnetId: {'Fn::GetAtt': [LaunchDiscovery, PublicSubnet]}
        AllocationId: {'Fn::GetAtt': [PublicAddress, AllocationId]}
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  PublicTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: PublicEnabled
    Properties:
      VpcId: {'Fn::GetAtt': [LaunchDiscovery, VpcId]}
      TargetType: ip
      Protocol: TCP
      Port: 443
      HealthCheckProtocol: TCP
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  PublicListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: PublicEnabled
    Properties:
      LoadBalancerArn: {Ref: PublicLoadBalancer}
      Protocol: TCP
      Port: 443
      DefaultActions:
      - Type: forward
        TargetGroupArn: {Ref: PublicTargets}
  GuestIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: {Ref: ControllerGroup}
      IpProtocol: tcp
      FromPort: 19443
      ToPort: 19447
      SourceSecurityGroupId: {Ref: WorkspaceGroup}
  PostgresControllerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: {Ref: PostgresGroup}
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: {Ref: ControllerGroup}
  InstallationVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: {'Fn::GetAtt': [LaunchDiscovery, AvailabilityZone]}
      Encrypted: true
      Size: {Ref: DataVolumeSizeGiB}
      VolumeType: gp3
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  RegistryCacheVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AvailabilityZone: {'Fn::GetAtt': [LaunchDiscovery, AvailabilityZone]}
      Encrypted: true
      Size: {Ref: OciImageCacheSizeGiB}
      VolumeType: gp3
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
      - Key: shiftbox-volume-purpose
        Value: oci-image-cache
  HostRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Path:
        Fn::Sub:
        - /shiftbox-boundaries/${AWS::Region}/${DeploymentName}/
        - DeploymentName: {Ref: 'AWS::StackName'}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: ['ec2:DescribeTags', 'ecs:DiscoverPollEndpoint', 'ecs:Poll', 'ecs:StartTelemetrySession']
          Resource: '*'
          Condition:
            StringEquals:
              aws:RequestedRegion: {Ref: 'AWS::Region'}
        - Effect: Allow
          Action: ['ecs:DeregisterContainerInstance', 'ecs:RegisterContainerInstance', 'ecs:SubmitAttachmentStateChanges',
            'ecs:SubmitContainerStateChange', 'ecs:SubmitTaskStateChange']
          Resource: {'Fn::GetAtt': [Cluster, Arn]}
        - Effect: Allow
          Action: ecs:UpdateContainerInstancesState
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:container-instance/${Cluster}/*
        - Effect: Allow
          Action: ecs:TagResource
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:container-instance/${Cluster}/*
          Condition:
            StringEquals:
              ecs:CreateAction: RegisterContainerInstance
        - Effect: Allow
          Action: ecs:ListTagsForResource
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${Cluster}/*
          - Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:container-instance/${Cluster}/*
        - Effect: Allow
          Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
          Resource:
            Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ServicesLogGroup}:log-stream:ecs/*
  PostgresExecutionRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Path:
        Fn::Sub:
        - /shiftbox-boundaries/${AWS::Region}/${DeploymentName}/
        - DeploymentName: {Ref: 'AWS::StackName'}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
          - {Ref: PostgresAdminSecret}
          - {Ref: PostgresAppSecret}
          - {Ref: PostgresDexSecret}
        - Effect: Allow
          Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
          Resource:
            Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ServicesLogGroup}:log-stream:ecs/postgres/*
  ControllerExecutionRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Path:
        Fn::Sub:
        - /shiftbox-boundaries/${AWS::Region}/${DeploymentName}/
        - DeploymentName: {Ref: 'AWS::StackName'}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
          - {Ref: PostgresAppSecret}
          - {Ref: PostgresDexSecret}
          - {Ref: SetupClaim}
          - Fn::If:
            - PrivateTestArtifacts
            - Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:shiftbox-main-test-ghcr-??????
            - {Ref: 'AWS::NoValue'}
        - Effect: Allow
          Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
          Resource:
            Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ServicesLogGroup}:log-stream:ecs/controller/*
  ControllerTaskRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Path:
        Fn::Sub:
        - /shiftbox-boundaries/${AWS::Region}/${DeploymentName}/
        - DeploymentName: {Ref: 'AWS::StackName'}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: route53:ListHostedZones
          Resource: '*'
        - Effect: Allow
          Action: route53:GetChange
          Resource:
            Fn::Sub: arn:${AWS::Partition}:route53:::change/*
        - Effect: Allow
          Action: route53:ChangeResourceRecordSets
          Resource:
            Fn::Sub:
            - arn:${AWS::Partition}:route53:::hostedzone/${ZoneId}
            - ZoneId:
                Fn::If:
                - CreateManagedPublicZone
                - {Ref: ManagedPublicZone}
                - {Ref: PublicDnsZone}
          Condition:
            ForAllValues:StringEquals:
              route53:ChangeResourceRecordSetsRecordTypes: [TXT]
              route53:ChangeResourceRecordSetsActions: [UPSERT, DELETE]
              route53:ChangeResourceRecordSetsNormalizedRecordNames:
              - Fn::Sub:
                - _acme-challenge.${DeploymentName}.${BaseDomain}
                - DeploymentName: {Ref: 'AWS::StackName'}
                  BaseDomain: {'Fn::GetAtt': [LaunchDiscovery, BaseDomain]}
              - Fn::Sub:
                - _acme-challenge.ide.${DeploymentName}.${BaseDomain}
                - DeploymentName: {Ref: 'AWS::StackName'}
                  BaseDomain: {'Fn::GetAtt': [LaunchDiscovery, BaseDomain]}
              - Fn::Sub:
                - _acme-challenge.preview.${DeploymentName}.${BaseDomain}
                - DeploymentName: {Ref: 'AWS::StackName'}
                  BaseDomain: {'Fn::GetAtt': [LaunchDiscovery, BaseDomain]}
              - Fn::Sub:
                - _acme-challenge.repair.${DeploymentName}.${BaseDomain}
                - DeploymentName: {Ref: 'AWS::StackName'}
                  BaseDomain: {'Fn::GetAtt': [LaunchDiscovery, BaseDomain]}
        - Sid: ObserveRegionalResources
          Effect: Allow
          Action:
          - ec2:DescribeImages
          - ec2:DescribeInstances
          - ec2:DescribeInstanceTypes
          - ec2:DescribeInstanceTypeOfferings
          - ec2:DescribeNetworkInterfaces
          - ec2:DescribeSecurityGroups
          - ec2:DescribeSubnets
          - ec2:DescribeVolumes
          - ec2:DescribeVpcs
          Resource: '*'
          Condition:
            StringEquals:
              aws:RequestedRegion: {Ref: 'AWS::Region'}
        - Sid: LaunchOfficialImage
          Effect: Allow
          Action: ec2:RunInstances
          Resource:
            Fn::Sub:
            - arn:${AWS::Partition}:ec2:${AWS::Region}::image/${ImageId}
            - ImageId: {'Fn::GetAtt': [LaunchDiscovery, WorkspaceAmi]}
          Condition:
            StringEquals:
              ec2:Owner: {'Fn::GetAtt': [LaunchDiscovery, PublisherAccount]}
        - Sid: LaunchInWorkspaceNetwork
          Effect: Allow
          Action: ec2:RunInstances
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${WorkspaceSubnet}
          - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${WorkspaceGroup}
        - Sid: LaunchOwnedInstances
          Effect: Allow
          Action: ec2:RunInstances
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
          Condition:
            StringEquals:
              aws:RequestTag/ShiftBoxWorkspaceDeployment: {Ref: 'AWS::StackName'}
        - Sid: LaunchOwnedEncryptedVolumes
          Effect: Allow
          Action: ec2:RunInstances
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
          Condition:
            StringEquals:
              aws:RequestTag/ShiftBoxWorkspaceDeployment: {Ref: 'AWS::StackName'}
            Bool:
              ec2:Encrypted: 'true'
        - Sid: LaunchOwnedPrivateInterfaces
          Effect: Allow
          Action: ec2:RunInstances
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
          Condition:
            StringEquals:
              aws:RequestTag/ShiftBoxWorkspaceDeployment: {Ref: 'AWS::StackName'}
            BoolIfExists:
              ec2:AssociatePublicIpAddress: 'false'
        - Sid: TagOnlyAtLaunch
          Effect: Allow
          Action: ec2:CreateTags
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
          - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
          - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
          Condition:
            StringEquals:
              ec2:CreateAction: RunInstances
              aws:RequestTag/ShiftBoxWorkspaceDeployment: {Ref: 'AWS::StackName'}
        - Sid: ManageOwnedInstances
          Effect: Allow
          Action: ['ec2:StartInstances', 'ec2:StopInstances', 'ec2:RebootInstances', 'ec2:TerminateInstances', 'ec2:DescribeInstanceAttribute']
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
          Condition:
            StringEquals:
              aws:ResourceTag/ShiftBoxWorkspaceDeployment: {Ref: 'AWS::StackName'}
        - Sid: DeliverEnrollment
          Effect: Allow
          Action: ec2:ModifyInstanceAttribute
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
          Condition:
            StringEquals:
              aws:ResourceTag/ShiftBoxWorkspaceDeployment: {Ref: 'AWS::StackName'}
              ec2:Attribute: UserData
        - Sid: RemoveOwnedVolumes
          Effect: Allow
          Action: ec2:DeleteVolume
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
          Condition:
            StringEquals:
              aws:ResourceTag/ShiftBoxWorkspaceDeployment: {Ref: 'AWS::StackName'}
        - Sid: RemoveOwnedInterfaces
          Effect: Allow
          Action: ec2:DeleteNetworkInterface
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
          Condition:
            StringEquals:
              aws:ResourceTag/ShiftBoxWorkspaceDeployment: {Ref: 'AWS::StackName'}
  HostRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub:
        - ${DeploymentName}-${AWS::Region}-host
        - DeploymentName: {Ref: 'AWS::StackName'}
      Path:
        Fn::Sub:
        - /shiftbox/${AWS::Region}/${DeploymentName}/
        - DeploymentName: {Ref: 'AWS::StackName'}
      PermissionsBoundary: {Ref: HostRoleBoundary}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName:
        Fn::Sub:
        - ${DeploymentName}-${AWS::Region}-host
        - DeploymentName: {Ref: 'AWS::StackName'}
      Path:
        Fn::Sub:
        - /shiftbox/${AWS::Region}/${DeploymentName}/
        - DeploymentName: {Ref: 'AWS::StackName'}
      Roles:
      - {Ref: HostRole}
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: {Ref: 'AWS::StackName'}
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  EcsHost:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: {'Fn::GetAtt': [LaunchDiscovery, HostAmi]}
      InstanceType: t3.medium
      IamInstanceProfile: {Ref: HostProfile}
      NetworkInterfaces:
      - DeviceIndex: '0'
        AssociatePublicIpAddress: false
        DeleteOnTermination: true
        SubnetId: {Ref: ServiceSubnet}
        GroupSet:
        - {Ref: HostGroup}
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
      - DeviceName: /dev/xvda
        Ebs:
          Encrypted: true
          VolumeType: gp3
          VolumeSize: 30
          DeleteOnTermination: true
      PropagateTagsToVolumeOnCreation: true
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
      UserData:
        Fn::Base64:
          Fn::Sub:
          - |
            #!/bin/sh
            set -eu

            install -d -m 0755 /etc/ecs /usr/local/libexec
            cat > /etc/ecs/ecs.config <<'AGENT'
            ECS_CLUSTER=${Cluster}
            ECS_CONTAINER_INSTANCE_TAGS={"shiftbox-cluster-name":"${DeploymentName}","shiftbox-project":"shiftbox"}
            ECS_AWSVPC_BLOCK_IMDS=true
            ECS_ENABLE_AWSLOGS_EXECUTIONROLE_OVERRIDE=true
            AGENT

            cat > /usr/local/libexec/shiftbox-mount-data <<'MOUNT_SCRIPT'
            ${MountScript}
            MOUNT_SCRIPT
            cat > /usr/local/libexec/shiftbox-mount-registry-cache <<'CACHE_SCRIPT'
            ${MountCacheScript}
            CACHE_SCRIPT
            cat > /usr/local/libexec/shiftbox-installation-tls <<'TLS_BOOTSTRAP'
            ${InstallationTlsScript}
            TLS_BOOTSTRAP
            chmod 0755 /usr/local/libexec/shiftbox-installation-tls
            chmod 0755 /usr/local/libexec/shiftbox-mount-data /usr/local/libexec/shiftbox-mount-registry-cache
            volume_serial=$(printf '%s' '${InstallationVolume}' | tr -d '-')

            cat > /etc/systemd/system/shiftbox-data.service <<DATA_UNIT
            [Unit]
            Description=Mount the persistent ShiftBox data volume
            After=cloud-final.service
            Before=docker.service ecs.service

            [Service]
            Type=oneshot
            ExecStart=/usr/local/libexec/shiftbox-mount-data $volume_serial /var/lib/shiftbox-data ${InitializeDataVolume}
            ${InstallationTlsUnit}
            RemainAfterExit=yes
            TimeoutStartSec=300
            DATA_UNIT

            cat > /etc/systemd/system/shiftbox-cache.service <<'CACHE_UNIT'
            [Unit]
            Description=Mount the dedicated ShiftBox OCI image cache
            After=cloud-final.service

            [Service]
            Type=oneshot
            ExecStart=/usr/local/libexec/shiftbox-mount-registry-cache ${RegistryCacheVolume} /var/lib/shiftbox-registry-cache auto
            RemainAfterExit=yes
            TimeoutStartSec=300
            CACHE_UNIT

            for service in docker ecs; do
                install -d -m 0755 "/etc/systemd/system/$service.service.d"
                cat > "/etc/systemd/system/$service.service.d/shiftbox-data.conf" <<'DEPENDENCY'
            [Unit]
            Requires=shiftbox-data.service
            After=shiftbox-data.service
            DEPENDENCY
            done
            cat > /etc/systemd/system/ecs.service.d/shiftbox-cache.conf <<'CACHE_DEPENDENCY'
            [Unit]
            Wants=shiftbox-cache.service
            After=shiftbox-cache.service
            CACHE_DEPENDENCY

            systemctl daemon-reload
            systemctl enable --now --no-block ecs.service
          - MountScript: |
              #!/bin/sh
              set -eu

              volume_serial=$1
              destination=$2
              initialize=$3
              attempts=${4:-120}

              find_data_device() {
                  lsblk -dnpro NAME,SERIAL | awk -v serial="$volume_serial" '$2 == serial { print $1 }'
              }

              # Nitro device names can change after replacement. Wait for this EBS serial.
              device="$(find_data_device)"
              while [ -z "$device" ] && [ "$attempts" -gt 0 ]; do
                  sleep 2
                  attempts=$((attempts - 1))
                  device="$(find_data_device)"
              done
              if [ -z "$device" ] || [ ! -e "$device" ]; then
                  echo 'ShiftBox data volume is absent' >&2
                  exit 1
              fi

              mounted="$(findmnt -nro SOURCE --mountpoint "$destination" || true)"
              if [ -z "$mounted" ]; then
                  if filesystem="$(blkid -p -s TYPE -o value "$device")"; then
                      if [ "$filesystem" != xfs ]; then
                          echo 'ShiftBox data volume has an unexpected filesystem' >&2
                          exit 1
                      fi
                  else
                      status=$?
                      if [ "$status" -ne 2 ] || [ "$initialize" != true ]; then
                          echo 'ShiftBox data filesystem is unavailable' >&2
                          exit 1
                      fi
                      # Formatting requires explicit authorization for a newly created volume.
                      mkfs.xfs "$device"
                  fi
                  mkdir -p "$destination"
                  mount -t xfs "$device" "$destination"
                  mounted="$(findmnt -nro SOURCE --mountpoint "$destination")"
              fi

              expected_device="$(readlink -f "$device")"
              if ! mounted_device="$(readlink -f "$mounted")" || [ "$mounted_device" != "$expected_device" ]; then
                  echo 'ShiftBox data path belongs to a different volume' >&2
                  exit 1
              fi

              install -d -m 0700 -o 10001 -g 10001 "$destination/shiftbox"
              install -d -m 0700 -o 999 -g 999 "$destination/postgres"
              # The controller checks this marker before using its installation directory.
              install -m 0400 -o 10001 -g 10001 /dev/null "$destination/shiftbox/.persistent-volume"
            MountCacheScript: |
              #!/bin/sh
              set -eu

              volume_id=$1
              destination=$2
              initialize=$3
              attempts=${4:-120}
              case "$volume_id" in vol-*) ;; *) echo 'Expected an EBS volume ID' >&2; exit 1 ;; esac
              case "$initialize" in
                  true|false|auto) ;;
                  *) echo 'Expected cache initialization mode true, false, or auto' >&2; exit 1 ;;
              esac
              serial="vol${volume_id#vol-}"

              device_for_serial() {
                  lsblk -dnpro NAME,SERIAL | awk -v serial="$serial" '$2 == serial { print $1 }'
              }

              device="$(device_for_serial)"
              while [ -z "$device" ] && [ "$attempts" -gt 0 ]; do
                  sleep 2
                  attempts=$((attempts - 1))
                  device="$(device_for_serial)"
              done
              if [ -z "$device" ] || [ ! -e "$device" ]; then
                  echo 'Expected registry cache volume is absent' >&2
                  exit 1
              fi

              mounted="$(findmnt -nro SOURCE --mountpoint "$destination" || true)"
              if [ "$initialize" = true ] && [ -n "$mounted" ]; then
                  echo 'Initial cache preparation requires an unmounted volume' >&2
                  exit 1
              fi
              if [ -z "$mounted" ]; then
                  existing_targets="$(lsblk -dnro MOUNTPOINTS "$device")"
                  if [ -n "$existing_targets" ]; then
                      echo 'Registry cache volume is already mounted at a different path' >&2
                      exit 1
                  fi
                  if filesystem="$(blkid -p -s TYPE -o value "$device")"; then
                      if [ "$initialize" = true ]; then
                          echo 'Initial cache preparation requires a blank volume' >&2
                          exit 1
                      fi
                      if [ "$filesystem" != xfs ]; then
                          echo 'Registry cache volume has an unexpected filesystem' >&2
                          exit 1
                      fi
                  else
                      status=$?
                      if [ "$status" -ne 2 ] || [ "$initialize" = false ] ||
                          [ "$(lsblk -nrpo TYPE "$device")" != disk ]; then
                          echo 'Registry cache filesystem is unavailable or not confirmed blank' >&2
                          exit 1
                      fi
                      if ! signatures="$(wipefs --noheadings "$device")" || [ -n "$signatures" ]; then
                          echo 'Registry cache filesystem is unavailable or not confirmed blank' >&2
                          exit 1
                      fi
                      mkfs.xfs "$device"
                  fi

                  install -d -m 0755 "$destination"
                  mount -t xfs "$device" "$destination"
                  mounted="$(findmnt -nro SOURCE --mountpoint "$destination")"
              fi
              if [ "$(readlink -f "$mounted")" != "$(readlink -f "$device")" ]; then
                  echo 'Registry cache mount belongs to a different volume' >&2
                  exit 1
              fi

              # CloudFormation owns this disk and can increase its size between host boots.
              # Grow only after verifying the mounted device so the change exposes the new capacity.
              if [ "$initialize" = auto ]; then
                  xfs_growfs "$destination"
              fi

              install -d -m 0700 -o 10001 -g 10001 "$destination/cache"
              marker="$(mktemp)"
              trap 'rm -f "$marker"' EXIT
              printf '%s\n' "$volume_id" > "$marker"
              install -m 0444 -o 0 -g 0 "$marker" "$destination/.shiftbox-registry-cache"
            InstallationTlsScript: |
              #!/bin/sh
              # Run after the retained volume is mounted and before the ECS agent starts.
              set -eu
              umask 077
              root=$1
              suffix=$2
              region=$3
              trust_secret=$4
              browser="$root/browser-identity"
              postgres="$root/pg-identity"
              database_trust="$root/database-trust"
              command -v openssl >/dev/null
              command -v aws >/dev/null

              # Publish each identity directory atomically. Partial generation leaves no
              # consumer-visible files. A published identity is never silently regenerated.
              issue() (
                  target=$1
                  common_name=$2
                  names=$3
                  if [ -d "$target" ]; then
                      return
                  fi
                  scratch=$(mktemp -d "$root/.tls.XXXXXXXX")
                  trap 'rm -rf -- "$scratch"' EXIT
                  openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 730 \
                      -subj "/CN=ShiftBox $common_name installation CA" \
                      -addext 'basicConstraints=critical,CA:TRUE,pathlen:0' \
                      -addext 'keyUsage=critical,keyCertSign,cRLSign' -keyout "$scratch/ca.key" -out "$scratch/ca.crt"
                  openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
                      -subj "/CN=$common_name" -keyout "$scratch/server.key" -out "$scratch/server.csr"
                  cat > "$scratch/extensions" <<EXTENSIONS
              basicConstraints=critical,CA:FALSE
              keyUsage=critical,digitalSignature
              extendedKeyUsage=serverAuth
              subjectAltName=$names
              EXTENSIONS
                  openssl x509 -req -in "$scratch/server.csr" -CA "$scratch/ca.crt" -CAkey "$scratch/ca.key" \
                      -days 365 -sha256 -extfile "$scratch/extensions" -out "$scratch/server.crt"
                  rm -- "$scratch/ca.key" "$scratch/server.csr" "$scratch/extensions"
                  mv -- "$scratch" "$target"
              )

              if [ "$trust_secret" != - ]; then
                  issue "$browser" "shiftbox.$suffix" "DNS:shiftbox.$suffix,DNS:*.ide.$suffix,DNS:*.preview.$suffix,DNS:*.repair.$suffix"
              fi
              issue "$postgres" "postgres.$suffix" "DNS:postgres.$suffix"
              verify() (
                  identity=$1
                  hostname=$2
                  openssl verify -CAfile "$identity/ca.crt" -purpose sslserver -verify_hostname "$hostname" "$identity/server.crt" >/dev/null
                  test "$(openssl pkey -in "$identity/server.key" -pubout)" = "$(openssl x509 -in "$identity/server.crt" -pubkey -noout)"
              )
              verify "$postgres" "postgres.$suffix"

              install -d -m 0755 "$database_trust"
              public_ca=$(mktemp "$database_trust/.ca.XXXXXXXX")
              trap 'rm -f -- "$public_ca"' EXIT
              cat "$postgres/ca.crt" > "$public_ca"
              chmod 0444 "$public_ca"
              mv -f -- "$public_ca" "$database_trust/ca.crt"
              # The Postgres start script runs as root and stages the database leaf/key with
              # the postgres container's own user. No other task mounts this directory.
              chown -R 0:0 "$postgres"

              if [ "$trust_secret" = - ]; then
                  exit 0
              fi
              verify "$browser" "shiftbox.$suffix"
              chown -R 10001:10001 "$browser"

              # The public CA is the only certificate material sent to AWS. A stable token
              # makes retries idempotent and never replaces the existing client trust anchor.
              version=$(openssl dgst -sha256 -r "$browser/ca.crt" | cut -d ' ' -f 1)
              AWS_PAGER='' aws --region "$region" secretsmanager put-secret-value --secret-id "$trust_secret" \
                  --client-request-token "$version" --secret-string "file://$browser/ca.crt" >/dev/null
            InstallationTlsUnit:
              Fn::Sub:
              - ExecStartPost=/usr/local/libexec/shiftbox-installation-tls /var/lib/shiftbox-data ${DnsSuffix} ${AWS::Region}
                ${TrustSecret}
              - TrustSecret: '-'
                DnsSuffix: {'Fn::GetAtt': [LaunchDiscovery, DnsSuffix]}
            DeploymentName: {Ref: 'AWS::StackName'}
            InitializeDataVolume: 'true'
