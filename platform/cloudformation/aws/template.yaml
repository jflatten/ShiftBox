            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount: {Ref: 'AWS::AccountId'}
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
      Policies:
      - PolicyName: ReadPostgresCredentials
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
            - {Ref: PostgresAdminSecret}
            - {Ref: PostgresAppSecret}
            - {Ref: PostgresDexSecret}
          - Effect: Allow
            Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ServicesLogGroup}:log-stream:ecs/postgres/*
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  ControllerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub:
        - ${DeploymentName}-${AWS::Region}-ctrl-exec
        - DeploymentName: {Ref: 'AWS::StackName'}
      Path:
        Fn::Sub:
        - /shiftbox/${AWS::Region}/${DeploymentName}/
        - DeploymentName: {Ref: 'AWS::StackName'}
      PermissionsBoundary: {Ref: ControllerExecutionRoleBoundary}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount: {Ref: 'AWS::AccountId'}
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
      Policies:
      - PolicyName: ReadControllerCredentials
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
            - {Ref: PostgresAppSecret}
            - {Ref: PostgresDexSecret}
            - {Ref: SetupClaim}
            - Fn::If:
              - PrivateTestArtifacts
              - Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:shiftbox-main-test-ghcr-??????
              - {Ref: 'AWS::NoValue'}
          - Effect: Allow
            Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ServicesLogGroup}:log-stream:ecs/controller/*
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  ControllerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub:
        - ${DeploymentName}-${AWS::Region}-ctrl-task
        - DeploymentName: {Ref: 'AWS::StackName'}
      Path:
        Fn::Sub:
        - /shiftbox/${AWS::Region}/${DeploymentName}/
        - DeploymentName: {Ref: 'AWS::StackName'}
      PermissionsBoundary: {Ref: ControllerTaskRoleBoundary}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount: {Ref: 'AWS::AccountId'}
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
      Policies:
      - PolicyName: OwnedWorkspaces
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: route53:ListHostedZones
            Resource: '*'
          - Effect: Allow
            Action: route53:GetChange
            Resource:
              Fn::Sub: arn:${AWS::Partition}:route53:::change/*
          - Effect: Allow
            Action: route53:ChangeResourceRecordSets
            Resource:
              Fn::Sub:
              - arn:${AWS::Partition}:route53:::hostedzone/${ZoneId}
              - ZoneId:
                  Fn::If:
                  - CreateManagedPublicZone
                  - {Ref: ManagedPublicZone}
                  - {Ref: PublicDnsZone}
            Condition:
              ForAllValues:StringEquals:
                route53:ChangeResourceRecordSetsRecordTypes: [TXT]
                route53:ChangeResourceRecordSetsActions: [UPSERT, DELETE]
                route53:ChangeResourceRecordSetsNormalizedRecordNames:
                - Fn::Sub:
                  - _acme-challenge.${DeploymentName}.${BaseDomain}
                  - DeploymentName: {Ref: 'AWS::StackName'}
                    BaseDomain: {'Fn::GetAtt': [LaunchDiscovery, BaseDomain]}
                - Fn::Sub:
                  - _acme-challenge.ide.${DeploymentName}.${BaseDomain}
                  - DeploymentName: {Ref: 'AWS::StackName'}
                    BaseDomain: {'Fn::GetAtt': [LaunchDiscovery, BaseDomain]}
                - Fn::Sub:
                  - _acme-challenge.preview.${DeploymentName}.${BaseDomain}
                  - DeploymentName: {Ref: 'AWS::StackName'}
                    BaseDomain: {'Fn::GetAtt': [LaunchDiscovery, BaseDomain]}
                - Fn::Sub:
                  - _acme-challenge.repair.${DeploymentName}.${BaseDomain}
                  - DeploymentName: {Ref: 'AWS::StackName'}
                    BaseDomain: {'Fn::GetAtt': [LaunchDiscovery, BaseDomain]}
          - Sid: ObserveRegionalResources
            Effect: Allow
            Action:
            - ec2:DescribeImages
            - ec2:DescribeInstances
            - ec2:DescribeInstanceTypes
            - ec2:DescribeInstanceTypeOfferings
            - ec2:DescribeNetworkInterfaces
            - ec2:DescribeSecurityGroups
            - ec2:DescribeSubnets
            - ec2:DescribeVolumes
            - ec2:DescribeVpcs
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: {Ref: 'AWS::Region'}
          - Sid: LaunchOfficialImage
            Effect: Allow
            Action: ec2:RunInstances
            Resource:
              Fn::Sub:
              - arn:${AWS::Partition}:ec2:${AWS::Region}::image/${ImageId}
              - ImageId: {'Fn::GetAtt': [LaunchDiscovery, WorkspaceAmi]}
            Condition:
              StringEquals:
                ec2:Owner: {'Fn::GetAtt': [LaunchDiscovery, PublisherAccount]}
          - Sid: LaunchInWorkspaceNetwork
            Effect: Allow
            Action: ec2:RunInstances
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${WorkspaceSubnet}
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${WorkspaceGroup}
          - Sid: LaunchOwnedInstances
            Effect: Allow
            Action: ec2:RunInstances
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
            Condition:
              StringEquals:
                aws:RequestTag/ShiftBoxWorkspaceDeployment: {Ref: 'AWS::StackName'}
          - Sid: LaunchOwnedEncryptedVolumes
            Effect: Allow
            Action: ec2:RunInstances
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
            Condition:
              StringEquals:
                aws:RequestTag/ShiftBoxWorkspaceDeployment: {Ref: 'AWS::StackName'}
              Bool:
                ec2:Encrypted: 'true'
          - Sid: LaunchOwnedPrivateInterfaces
            Effect: Allow
            Action: ec2:RunInstances
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
            Condition:
              StringEquals:
                aws:RequestTag/ShiftBoxWorkspaceDeployment: {Ref: 'AWS::StackName'}
              BoolIfExists:
                ec2:AssociatePublicIpAddress: 'false'
          - Sid: TagOnlyAtLaunch
            Effect: Allow
            Action: ec2:CreateTags
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
            - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
            Condition:
              StringEquals:
                ec2:CreateAction: RunInstances
                aws:RequestTag/ShiftBoxWorkspaceDeployment: {Ref: 'AWS::StackName'}
          - Sid: ManageOwnedInstances
            Effect: Allow
            Action: ['ec2:StartInstances', 'ec2:StopInstances', 'ec2:RebootInstances', 'ec2:TerminateInstances', 'ec2:DescribeInstanceAttribute']
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
            Condition:
              StringEquals:
                aws:ResourceTag/ShiftBoxWorkspaceDeployment: {Ref: 'AWS::StackName'}
          - Sid: DeliverEnrollment
            Effect: Allow
            Action: ec2:ModifyInstanceAttribute
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
            Condition:
              StringEquals:
                aws:ResourceTag/ShiftBoxWorkspaceDeployment: {Ref: 'AWS::StackName'}
                ec2:Attribute: UserData
          - Sid: RemoveOwnedVolumes
            Effect: Allow
            Action: ec2:DeleteVolume
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
            Condition:
              StringEquals:
                aws:ResourceTag/ShiftBoxWorkspaceDeployment: {Ref: 'AWS::StackName'}
          - Sid: RemoveOwnedInterfaces
            Effect: Allow
            Action: ec2:DeleteNetworkInterface
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
            Condition:
              StringEquals:
                aws:ResourceTag/ShiftBoxWorkspaceDeployment: {Ref: 'AWS::StackName'}
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  PostgresTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family:
        Fn::Sub:
        - ${DeploymentName}-postgres
        - DeploymentName: {Ref: 'AWS::StackName'}
      RequiresCompatibilities: [EC2]
      NetworkMode: awsvpc
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: {'Fn::GetAtt': [PostgresExecutionRole, Arn]}
      Volumes:
      - Name: data
        Host:
          SourcePath: /var/lib/shiftbox-data/postgres
      - Name: postgres-identity
        Host:
          SourcePath: /var/lib/shiftbox-data/pg-identity
      ContainerDefinitions:
      - Name: postgres
        Image: {'Fn::GetAtt': [LaunchDiscovery, PostgresImage]}
        Essential: true
        MemoryReservation: 512
        EntryPoint: [/bin/sh, -ec]
        Command: ["#!/bin/sh\nset -eu\numask 077\n\n# The private key stays in the task filesystem. Only database data\
            \ uses EBS.\ntls=/tmp/shiftbox-postgres-tls\ninstall -d -m 0700 -o postgres -g postgres \"$tls\"\nif [ -d\
            \ /run/shiftbox/postgres-tls ]; then\n    cat /run/shiftbox/postgres-tls/server.crt > \"$tls/server.crt\"\
            \n    cat /run/shiftbox/postgres-tls/server.key > \"$tls/server.key\"\nelse\n    printf '%s\\n' \"${POSTGRES_TLS_CERT:?missing\
            \ database certificate}\" > \"$tls/server.crt\"\n    printf '%s\\n' \"${POSTGRES_TLS_KEY:?missing database\
            \ private key}\" > \"$tls/server.key\"\nfi\nchown postgres:postgres \"$tls/server.crt\" \"$tls/server.key\"\
            \nunset POSTGRES_TLS_CERT POSTGRES_TLS_KEY\n\ncat > \"$tls/pg_hba.conf\" <<'HBA'\nlocal all all trust\nhostssl\
            \ shiftbox shiftbox_app,shiftbox_dex all scram-sha-256\nHBA\nchown postgres:postgres \"$tls/pg_hba.conf\"\
            \n\n# The official entrypoint runs this script only on a new PGDATA directory.\ncat > /docker-entrypoint-initdb.d/01-shiftbox.sql\
            \ <<'SQL'\n\\getenv app_password SHIFTBOX_APP_PASSWORD\n\\getenv dex_password SHIFTBOX_DEX_PASSWORD\nCREATE\
            \ ROLE shiftbox_app LOGIN PASSWORD :'app_password';\nCREATE ROLE shiftbox_dex LOGIN PASSWORD :'dex_password';\n\
            CREATE SCHEMA shiftbox AUTHORIZATION shiftbox_app;\nCREATE SCHEMA dex AUTHORIZATION shiftbox_dex;\nALTER\
            \ ROLE shiftbox_app IN DATABASE shiftbox SET search_path TO shiftbox;\nALTER ROLE shiftbox_dex IN DATABASE\
            \ shiftbox SET search_path TO dex;\nREVOKE ALL ON SCHEMA public FROM PUBLIC;\nREVOKE ALL ON DATABASE shiftbox\
            \ FROM PUBLIC;\nGRANT CONNECT ON DATABASE shiftbox TO shiftbox_app, shiftbox_dex;\nSQL\nchmod 0644 /docker-entrypoint-initdb.d/01-shiftbox.sql\n\
            \nexec docker-entrypoint.sh postgres -c ssl=on -c \"ssl_cert_file=$tls/server.crt\" \\\n    -c \"ssl_key_file=$tls/server.key\"\
            \ -c \"hba_file=$tls/pg_hba.conf\"\n"]
        MountPoints:
        - SourceVolume: data
          ContainerPath: /var/lib/postgresql/data
        - SourceVolume: postgres-identity
          ContainerPath: /run/shiftbox/postgres-tls
          ReadOnly: true
        Environment:
        - Name: PGDATA
          Value: /var/lib/postgresql/data/pgdata
        - Name: POSTGRES_DB
          Value: shiftbox
        Secrets:
        - Name: POSTGRES_PASSWORD
          ValueFrom: {Ref: PostgresAdminSecret}
        - Name: SHIFTBOX_APP_PASSWORD
          ValueFrom: {Ref: PostgresAppSecret}
        - Name: SHIFTBOX_DEX_PASSWORD
          ValueFrom: {Ref: PostgresDexSecret}
        HealthCheck:
          Command:
          - CMD
          - pg_isready
          - -h
          - localhost
          - -p
          - '5432'
          - -d
          - shiftbox
          Interval: 10
          Retries: 6
          StartPeriod: 30
          Timeout: 5
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: {Ref: ServicesLogGroup}
            awslogs-region: {Ref: 'AWS::Region'}
            awslogs-stream-prefix: ecs
        PortMappings:
        - ContainerPort: 5432
          Protocol: tcp
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  ControllerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family:
        Fn::Sub:
        - ${DeploymentName}-controller
        - DeploymentName: {Ref: 'AWS::StackName'}
      RequiresCompatibilities: [EC2]
      NetworkMode: awsvpc
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: {'Fn::GetAtt': [ControllerExecutionRole, Arn]}
      TaskRoleArn: {'Fn::GetAtt': [ControllerTaskRole, Arn]}
      Volumes:
      - Name: installation
        Host:
          SourcePath: /var/lib/shiftbox-data/shiftbox
      - Name: registry-cache
        Host:
          SourcePath: /var/lib/shiftbox-registry-cache
      - Name: database-trust
        Host:
          SourcePath: /var/lib/shiftbox-data/database-trust
      ContainerDefinitions:
      - Name: controller
        Image: {'Fn::GetAtt': [LaunchDiscovery, ControllerImage]}
        RepositoryCredentials:
          Fn::If:
          - PrivateTestArtifacts
          - CredentialsParameter: shiftbox-main-test-ghcr
          - {Ref: 'AWS::NoValue'}
        Essential: true
        MemoryReservation: 512
        EntryPoint: [/usr/local/bin/shiftbox-cloud]
        Command: [one-pass]
        LinuxParameters:
          InitProcessEnabled: true
        SystemControls:
        - Namespace: net.ipv4.ip_unprivileged_port_start
          Value: '443'
        MountPoints:
        - SourceVolume: installation
          ContainerPath: /var/lib/shiftbox
        - SourceVolume: registry-cache
          ContainerPath: /var/lib/shiftbox-registry-cache
        - SourceVolume: database-trust
          ContainerPath: /run/shiftbox/database-trust
          ReadOnly: true
        Environment:
        - Name: SHIFTBOX_IMAGE_CACHE_VOLUME_ID
          Value: {Ref: RegistryCacheVolume}
        - Name: SHIFTBOX_DB_HOST
          Value:
            Fn::Sub:
            - postgres.${DnsSuffix}
            - DnsSuffix: {'Fn::GetAtt': [LaunchDiscovery, DnsSuffix]}
        - Name: SHIFTBOX_CLOUD_CONFIG
          Value:
            Fn::Sub:
            - '{"installationDir":"/var/lib/shiftbox","dataProfile":"postgres","managementOrigin":"${BrowserOrigin}",
              "runtime":{"provider":"ec2","ec2":{"accountId":"${AWS::AccountId}","region":"${AWS::Region}", "dataVolumeId":"${InstallationVolume}","subnetId":"${WorkspaceSubnet}","securityGroupId":"${WorkspaceGroup}",
              "deployment":"${DeploymentName}","environment":"production","officialImage":{"amiId":"${ImageId}", "publisherAccountId":"${ImageOwner}","rootDeviceName":"${RootDevice}","rootSnapshotId":"${Snapshot}",
              "sourceAmiId":"${SourceAmi}","sourceRegion":"${SourceRegion}","sourceCommit":"${SourceRevision}", "releaseId":"${ImageRelease}","guestRelease":"${GuestRelease}","architecture":"${Architecture}",
              "minimumDiskGiB":${MinimumDisk},"catalogSha256":"${CatalogSHA256}"},"starterCatalog":"${StarterCatalog}"},"browserAddress":":${BrowserPort}",
              "guestHost":"guest.${DnsSuffix}","enrollmentAddress":":19443","pollAddress":":19444","tunnelAddress":":19445"}}'
            - BrowserOrigin:
                Fn::Sub:
                - https://${DeploymentName}.${BaseDomain}
                - DeploymentName: {Ref: 'AWS::StackName'}
                  BaseDomain: {'Fn::GetAtt': [LaunchDiscovery, BaseDomain]}
              BrowserPort: '443'
              ImageId: {'Fn::GetAtt': [LaunchDiscovery, WorkspaceAmi]}
              ImageOwner: {'Fn::GetAtt': [LaunchDiscovery, PublisherAccount]}
              RootDevice: {'Fn::GetAtt': [LaunchDiscovery, WorkspaceRootDevice]}
              Snapshot: {'Fn::GetAtt': [LaunchDiscovery, WorkspaceSnapshot]}
              SourceAmi: {'Fn::GetAtt': [LaunchDiscovery, WorkspaceSourceAmi]}
              SourceRegion: {'Fn::GetAtt': [LaunchDiscovery, WorkspaceSourceRegion]}
              SourceRevision: {'Fn::GetAtt': [LaunchDiscovery, WorkspaceSourceRevision]}
              ImageRelease: {'Fn::GetAtt': [LaunchDiscovery, WorkspaceRelease]}
              GuestRelease: {'Fn::GetAtt': [LaunchDiscovery, GuestRelease]}
              Architecture: {'Fn::GetAtt': [LaunchDiscovery, WorkspaceArchitecture]}
              MinimumDisk: {'Fn::GetAtt': [LaunchDiscovery, WorkspaceMinimumDiskGiB]}
              CatalogSHA256: {'Fn::GetAtt': [LaunchDiscovery, WorkspaceCatalogSHA256]}
              StarterCatalog: {'Fn::GetAtt': [LaunchDiscovery, WorkspaceStarterCatalog]}
              DeploymentName: {Ref: 'AWS::StackName'}
              DnsSuffix: {'Fn::GetAtt': [LaunchDiscovery, DnsSuffix]}
        - Name: SHIFTBOX_ACME_EMAIL
          Value: {Ref: AcmeContactEmail}
        Secrets:
        - Name: SHIFTBOX_APP_PASSWORD
          ValueFrom: {Ref: PostgresAppSecret}
        - Name: SHIFTBOX_DEX_PASSWORD
          ValueFrom: {Ref: PostgresDexSecret}
        - Name: SHIFTBOX_BOOTSTRAP_CLAIM
          ValueFrom: {Ref: SetupClaim}
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: {Ref: ServicesLogGroup}
            awslogs-region: {Ref: 'AWS::Region'}
            awslogs-stream-prefix: ecs
        PortMappings:
        - ContainerPort: 443
          Protocol: tcp
        - ContainerPort: 19443
          Protocol: tcp
        - ContainerPort: 19444
          Protocol: tcp
        - ContainerPort: 19445
          Protocol: tcp
        - ContainerPort: 19446
          Protocol: tcp
        - ContainerPort: 19447
          Protocol: tcp
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  PostgresService:
    Type: AWS::ECS::Service
    DependsOn: [DataAttachment, PrivateRecords, PostgresControllerIngress]
    Properties:
      ServiceName: postgres
      Cluster: {Ref: Cluster}
      LaunchType: EC2
      TaskDefinition: {Ref: PostgresTask}
      DesiredCount: 1
      DeploymentConfiguration:
        MaximumPercent: 100
        MinimumHealthyPercent: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
          - {Ref: ServiceSubnet}
          SecurityGroups:
          - {Ref: PostgresGroup}
      ServiceRegistries:
      - RegistryArn: {'Fn::GetAtt': [PostgresDiscovery, Arn]}
      PropagateTags: TASK_DEFINITION
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  ControllerService:
    Type: AWS::ECS::Service
    DependsOn: [PostgresService, RegistryCacheAttachment]
    Properties:
      ServiceName: controller
      Cluster: {Ref: Cluster}
      LaunchType: EC2
      TaskDefinition: {Ref: ControllerTask}
      DesiredCount: 1
      DeploymentConfiguration:
        MaximumPercent: 100
        MinimumHealthyPercent: 0
      HealthCheckGracePeriodSeconds:
        Fn::If:
        - PublicEnabled
        - 360
        - {Ref: 'AWS::NoValue'}
      LoadBalancers:
        Fn::If:
        - PublicEnabled
        - - ContainerName: controller
            ContainerPort: 443
            TargetGroupArn: {Ref: PublicTargets}
        - []
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
          - {Ref: ServiceSubnet}
          SecurityGroups:
          - {Ref: ControllerGroup}
      ServiceRegistries:
      - RegistryArn: {'Fn::GetAtt': [ControllerDiscovery, Arn]}
      PropagateTags: TASK_DEFINITION
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
      - Fn::If:
        - PublicEnabled
        - Key: shiftbox-public-listener
          Value: {Ref: PublicListener}
        - {Ref: 'AWS::NoValue'}
      - Fn::If:
        - CreateManagedPublicZone
        - Key: shiftbox-public-delegation
          Value: {Ref: ManagedPublicDelegation}
        - {Ref: 'AWS::NoValue'}
  DiscoveryLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}-${AWS::Region}-discovery
      RetentionInDays: 14
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
  DiscoveryBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: ['ec2:DescribeSubnets', 'ec2:DescribeRouteTables']
          Resource: '*'
          Condition:
            StringEquals:
              aws:RequestedRegion: {Ref: 'AWS::Region'}
        - Effect: Allow
          Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
          Resource:
            Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${DiscoveryLogs}:log-stream:*
        - Effect: Allow
          Action: ['ec2:DescribeRegions', 'ec2:DescribeVpcs']
          Resource: '*'
        - Effect: Allow
          Action: route53:ListHostedZonesByVPC
          Resource: '*'
        - Effect: Allow
          Action: route53:GetChange
          Resource:
            Fn::Sub: arn:${AWS::Partition}:route53:::change/*
        - Effect: Allow
          Action: ['route53:GetHostedZone', 'route53:ChangeTagsForResource', 'route53:DeleteHostedZone']
          Resource:
            Fn::Sub: arn:${AWS::Partition}:route53:::hostedzone/*
        - Effect: Allow
          Action: route53:CreateHostedZone
          Resource: '*'
          Condition:
            ForAllValues:StringLike:
              route53:VPCs:
                Fn::Sub: VPCId=vpc-*,VPCRegion=${AWS::Region}
            'Null':
              route53:VPCs: 'false'
  DiscoveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${AWS::StackName}-${AWS::Region}-discovery
      Path:
        Fn::Sub: /shiftbox/${AWS::Region}/${AWS::StackName}/
      PermissionsBoundary: {Ref: DiscoveryBoundary}
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: sts:AssumeRole
          Principal:
            Service: lambda.amazonaws.com
      Policies:
      - PolicyName: ResolveLaunchInputs
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ['ec2:DescribeSubnets', 'ec2:DescribeRouteTables']
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: {Ref: 'AWS::Region'}
          - Effect: Allow
            Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${DiscoveryLogs}:log-stream:*
          - Effect: Allow
            Action: ['ec2:DescribeRegions', 'ec2:DescribeVpcs']
            Resource: '*'
          - Effect: Allow
            Action: route53:ListHostedZonesByVPC
            Resource: '*'
          - Effect: Allow
            Action: route53:GetChange
            Resource:
              Fn::Sub: arn:${AWS::Partition}:route53:::change/*
          - Effect: Allow
            Action: ['route53:GetHostedZone', 'route53:ChangeTagsForResource', 'route53:DeleteHostedZone']
            Resource:
              Fn::Sub: arn:${AWS::Partition}:route53:::hostedzone/*
          - Effect: Allow
            Action: route53:CreateHostedZone
            Resource: '*'
            Condition:
              ForAllValues:StringLike:
                route53:VPCs:
                  Fn::Sub: VPCId=vpc-*,VPCRegion=${AWS::Region}
              'Null':
                route53:VPCs: 'false'
  DiscoveryFunction:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Resolve launch form choices before dependent resources are created.
        must: [Preserve adopted zones and zones with surviving records., Reject malformed or wrong-region release inputs
            before returning image pins., Verify the regional starter catalog against its pinned SHA-256.]
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-${AWS::Region}-discovery
      Role: {'Fn::GetAtt': [DiscoveryRole, Arn]}
      Runtime: python3.13
      Handler: index.handler
      Timeout: 390
      Tags:
      - Key: shiftbox-project
        Value: shiftbox
      - Key: shiftbox-cluster-name
        Value: {Ref: 'AWS::StackName'}
      Code:
        ZipFile: |
          """Resolve the AWS resources selected on the first-launch console form."""

          import base64
          import gzip
          import hashlib
          from io import BytesIO
          import json
          import logging
          import os
          import re
          import tarfile
          from urllib.request import urlopen


          log = logging.getLogger(__name__)
          DNS_NAME = re.compile(r"(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?")
          PRIVATE_ZONE_WAIT_SECONDS = 300
          PRIVATE_ZONE_POLL_SECONDS = 10
          MAX_SUPPORT_ARCHIVE_BYTES = 1024 * 1024
          # Leave room for discovery data and CloudFormation's 4096-byte response envelope.
          MAX_STARTER_CATALOG_BYTES = 1536


          SUPPORTED_REGIONS = ("us-east-1", "us-east-2", "us-west-1", "us-west-2")
          RELEASE_PIN_PATTERNS = {
              "Region": r"us-(?:east|west)-[12]",
              "ControllerImage": r"ghcr\.io/jflatten/shiftbox@sha256:[0-9a-f]{64}",
              "PostgresImage": r"docker\.io/library/postgres:17-(?:bookworm|bullseye|trixie)@sha256:[0-9a-f]{64}",
              "HostAmi": r"ami-[0-9a-f]{17}",
              "WorkspaceAmi": r"ami-[0-9a-f]{17}",
              "PublisherAccount": r"[0-9]{12}",
              "WorkspaceRootDevice": r"/dev/sda1",
              "WorkspaceSnapshot": r"snap-[0-9a-f]{17}",
              "WorkspaceSourceAmi": r"ami-[0-9a-f]{17}",
              "WorkspaceSourceRegion": r"us-(?:east|west)-[12]",
              "WorkspaceSourceRevision": r"[0-9a-f]{40}",
              "WorkspaceRelease": r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)-rc\.[1-9][0-9]*",
              "GuestRelease": r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)-rc\.[1-9][0-9]*",
              "WorkspaceArchitecture": r"amd64",
              "WorkspaceCatalogSHA256": r"[0-9a-f]{64}",
              "WorkspaceMinimumDiskGiB": r"32",
          }


          def parse_release_pins(raw, region, *, private_test=False):
              """Accept the complete regional inputs supplied by a verified release launch."""
              try:
                  pins = json.loads(raw)
              except (TypeError, ValueError) as error:
                  raise ValueError("Use the release launch link to supply the release inputs.") from error
              patterns = RELEASE_PIN_PATTERNS
              if private_test:
                  patterns = patterns | {
                      "ControllerImage": r"ghcr\.io/jflatten/shiftbox-main-test@sha256:[0-9a-f]{64}",
                      "PublisherAccount": r"888293065132",
                      "WorkspaceRelease": r"v0\.0\.0-rc\.[1-9][0-9]*",
                      "WorkspaceSourceRegion": r"us-east-2",
                      "WorkspaceStarterCatalog": r"[A-Za-z0-9+/]{1,2048}={0,2}",
                  }
              if not isinstance(pins, dict) or pins.keys() != patterns.keys():
                  raise ValueError("The release inputs are incomplete. Use the release launch link.")
              for key, pattern in patterns.items():
                  if not isinstance(pins[key], str) or not re.fullmatch(pattern, pins[key]):
                      raise ValueError(f"The release inputs have an invalid {key}. Use the release launch link.")
              if region not in SUPPORTED_REGIONS or pins["Region"] != region:
                  raise ValueError("Use the ShiftBox release launch link for this AWS region.")
              if pins["GuestRelease"] != pins["WorkspaceRelease"]:
                  raise ValueError("The workspace and guest release inputs must match.")
              if private_test:
                  if region != "us-east-2":
                      raise ValueError("Private test artifacts are available only in Ohio.")
                  verify_starter_catalog(pins, base64.b64decode(pins["WorkspaceStarterCatalog"], validate=True))
              return pins


          def verify_starter_catalog(pins, catalog):
              if not 0 < len(catalog) <= MAX_STARTER_CATALOG_BYTES:
                  raise ValueError("The regional starter AMI catalog is empty or oversized.")
              if hashlib.sha256(catalog).hexdigest() != pins["WorkspaceCatalogSHA256"]:
                  raise ValueError(f"The {pins['Region']} starter AMI catalog did not match the release checksum.")


          def load_starter_catalog(pins):
              """Return the exact catalog bytes selected and verified by the release inputs."""
              region = pins["Region"]
              release = pins["WorkspaceRelease"]
              url = f"https://github.com/jflatten/ShiftBox/releases/download/{release}/shiftbox-aws-support.tar.gz"
              try:
                  with urlopen(url, timeout=10) as response:
                      compressed = response.read(MAX_SUPPORT_ARCHIVE_BYTES + 1)
                  if len(compressed) > MAX_SUPPORT_ARCHIVE_BYTES:
                      raise ValueError("The release support archive is too large to read.")
                  with gzip.GzipFile(fileobj=BytesIO(compressed)) as stream:
                      contents = stream.read(MAX_SUPPORT_ARCHIVE_BYTES + 1)
                  if len(contents) > MAX_SUPPORT_ARCHIVE_BYTES:
                      raise ValueError("The expanded release support archive is too large to read.")
                  with tarfile.open(fileobj=BytesIO(contents), mode="r:") as archive:
                      entry = archive.getmember(f"catalog/{region}.json")
                      if not entry.isfile() or not 0 < entry.size <= MAX_STARTER_CATALOG_BYTES:
                          raise ValueError("The regional starter AMI catalog is empty, oversized, or not a regular file.")
                      catalog = archive.extractfile(entry).read()
              except (OSError, EOFError, tarfile.TarError, KeyError) as error:
                  raise ValueError(f"Could not read the {region} starter AMI catalog for ShiftBox {release}.") from error
              verify_starter_catalog(pins, catalog)
              return base64.b64encode(catalog).decode("ascii")


          def public_candidates(ec2, vpc, zone):
              """Find available subnets with a direct, active IPv4 route to the Internet."""
              tables = ec2.get_paginator("describe_route_tables").paginate(Filters=[{"Name": "vpc-id", "Values": [vpc]}])
              public_by_subnet = {}
              main_is_public = False
              for page in tables:
                  for table in page["RouteTables"]:
                      is_public = any(route.get("DestinationCidrBlock") == "0.0.0.0/0"
                                      and route.get("State") == "active"
                                      and route.get("GatewayId", "").startswith("igw-") for route in table["Routes"])
                      for association in table["Associations"]:
                          if association.get("Main"):
                              main_is_public = is_public
                          if "SubnetId" in association:
                              public_by_subnet[association["SubnetId"]] = is_public
              filters = [{"Name": "vpc-id", "Values": [vpc]}, {"Name": "availability-zone", "Values": [zone]},
                         {"Name": "state", "Values": ["available"]}]
              pages = ec2.get_paginator("describe_subnets").paginate(Filters=filters)
              return sorted((subnet for page in pages for subnet in page["Subnets"]
                             if subnet["VpcId"] == vpc and subnet["AvailabilityZone"] == zone
                             and subnet["State"] == "available" and subnet["AvailableIpAddressCount"] >= 8
                             and public_by_subnet.get(subnet["SubnetId"], main_is_public)), key=lambda subnet: subnet["SubnetId"])


          def resolve_launch(props, ec2, dns, *, previous_public_subnet=""):
              name = props["DeploymentName"]
              if not re.fullmatch(r"[a-z][a-z0-9-]{0,30}[a-z0-9]", name):
                  raise ValueError("Use a stack name of 2-32 lowercase letters, numbers, or hyphens, starting with a letter and ending with a letter or number.")
              ids = [props["ServiceSubnet"], props["WorkspaceSubnet"]]
              subnets = {subnet["SubnetId"]: subnet for subnet in ec2.describe_subnets(SubnetIds=sorted(set(ids)))["Subnets"]}
              if any(subnet_id not in subnets or subnets[subnet_id]["State"] != "available" for subnet_id in ids):
                  raise ValueError("Choose available service and workspace subnets.")
              service, workspace = (subnets[subnet_id] for subnet_id in ids)
              vpc = service["VpcId"]
              zone = service["AvailabilityZone"]
              if workspace["VpcId"] != vpc:
                  raise ValueError("Choose service and workspace subnets in the same VPC.")
              suffix = props.get("DnsSuffix") or f"{name}.internal"
              if not DNS_NAME.fullmatch(suffix):
                  raise ValueError("Enter a valid lowercase private DNS suffix.")

              domain = ""
              if props.get("PublicZone"):
                  hosted_zone = dns.get_hosted_zone(Id=props["PublicZone"])["HostedZone"]
                  if hosted_zone.get("Config", {}).get("PrivateZone"):
                      raise ValueError("Choose an authoritative public Route 53 hosted zone.")
                  domain = hosted_zone["Name"].rstrip(".")
                  if len(domain) > 160 or not DNS_NAME.fullmatch(domain) or suffix == domain:
                      raise ValueError("The public zone must have a supported DNS name distinct from the private DNS suffix.")

              public_subnet = ""
              if props.get("PublicAccess") == "true":
                  public_subnet = previous_public_subnet
                  if not public_subnet:
                      available = [subnet["SubnetId"] for subnet in public_candidates(ec2, vpc, zone)]
                      if not available:
                          raise ValueError(f"No eligible public subnet with eight free IPv4 addresses in {vpc} and {zone}.")
                      if len(available) != 1:
                          raise ValueError(
                              "More than one eligible public subnet. Choose a service subnet in an Availability Zone "
                              "with one eligible public subnet, or choose Private browser access. Eligible subnets: "
                              + ", ".join(available)
                          )
                      public_subnet = available[0]
              return {"VpcId": vpc, "AvailabilityZone": zone, "PublicSubnet": public_subnet,
                      "BaseDomain": domain, "DnsSuffix": suffix}


          def resolve_private_zone(props, dns, region, account, token):
              vpc = props["VpcId"]
              domain = props["BaseDomain"]
              query = {"VPCId": vpc, "VPCRegion": region}
              candidates = []
              while True:
                  page = dns.list_hosted_zones_by_vpc(**query)
                  candidates.extend(zone for zone in page["HostedZoneSummaries"] if zone["Name"].rstrip(".") == domain)
                  if not page.get("NextToken"):
                      break
                  query["NextToken"] = page["NextToken"]
              if len(candidates) > 1:
                  raise ValueError("The VPC has conflicting private hosted zones for the selected domain.")
              change_id = None
              if candidates:
                  zone = candidates[0]
                  if zone["Owner"].get("OwningAccount") != account:
                      raise ValueError("The matching private hosted zone is owned by another account or AWS service.")
                  zone_id = zone["HostedZoneId"].rsplit("/", 1)[-1]
                  owned = dns.get_hosted_zone(Id=zone_id)["HostedZone"].get("CallerReference") == token
              else:
                  created = dns.create_hosted_zone(Name=domain, CallerReference=token, VPC={"VPCId": vpc, "VPCRegion": region},
                                                   HostedZoneConfig={"Comment": "ShiftBox private browser DNS"})
                  zone_id, owned = created["HostedZone"]["Id"].rsplit("/", 1)[-1], True
                  if created["ChangeInfo"]["Status"] != "INSYNC":
                      change_id = created["ChangeInfo"]["Id"]
              return zone_id, owned, change_id


          def delete_private_zone(dns, zone_id, token):
              """Remove an empty zone this stack created. Preserve adopted and shared zones."""
              try:
                  zone = dns.get_hosted_zone(Id=zone_id)["HostedZone"]
                  if zone.get("CallerReference") == token and zone["Config"]["PrivateZone"]:
                      dns.delete_hosted_zone(Id=zone_id)
              except dns.exceptions.NoSuchHostedZone:
                  return
              except dns.exceptions.HostedZoneNotEmpty:
                  log.info("Preserving private hosted zone %s because other DNS records still use it", zone_id)


          def wait_for_private_zone(dns, change_id):
              from botocore.exceptions import WaiterError

              try:
                  dns.get_waiter("resource_record_sets_changed").wait(
                      Id=change_id,
                      WaiterConfig={"Delay": PRIVATE_ZONE_POLL_SECONDS,
                                    "MaxAttempts": PRIVATE_ZONE_WAIT_SECONDS // PRIVATE_ZONE_POLL_SECONDS + 1},
                  )
              except WaiterError as error:
                  last = error.last_response
                  if last.get("ChangeInfo", {}).get("Status") == "PENDING":
                      raise ValueError("Route 53 was still propagating the private hosted zone after five minutes.") from error
                  code = last.get("Error", {}).get("Code", "unknown status")
                  raise ValueError(f"Route 53 could not verify the private hosted zone ({code}).") from error


          def respond_to_cloudformation(event, context, cfnresponse):
              import boto3
              from botocore.config import Config
              from botocore.exceptions import ClientError

              kind = event["ResourceType"]
              request = event["RequestType"]
              props = event["ResourceProperties"]
              token = hashlib.sha256((event["StackId"] + event["LogicalResourceId"]).encode()).hexdigest()
              physical_id = event.get("PhysicalResourceId", token)
              data = {}
              status, reason = cfnresponse.SUCCESS, None
              config = Config(connect_timeout=3, read_timeout=5, retries={"total_max_attempts": 3, "mode": "standard"})
              try:
                  if kind == "Custom::ShiftBoxPrivateBrowserZone":
                      dns = boto3.client("route53", config=config)
                      if request == "Delete":
                          if physical_id.startswith("owned:"):
                              delete_private_zone(dns, physical_id.removeprefix("owned:"), token)
                      else:
                          old = event.get("OldResourceProperties", props)
                          if any(props[field] != old[field] for field in ("VpcId", "BaseDomain")):
                              raise ValueError("Keep the installed VPC and public zone unchanged.")
                          account = event["StackId"].split(":")[4]
                          zone_id, owned, change_id = resolve_private_zone(props, dns, os.environ["AWS_REGION"], account, token)
                          # Report the owned physical ID even if tagging or propagation fails.
                          physical_id = ("owned:" if owned else "adopted:") + zone_id
                          if change_id:
                              wait_for_private_zone(dns, change_id)
                          if owned:
                              dns.change_tags_for_resource(ResourceType="hostedzone", ResourceId=zone_id, AddTags=[
                                  {"Key": "shiftbox-project", "Value": "shiftbox"},
                                  {"Key": "shiftbox-cluster-name", "Value": props["DeploymentName"]},
                              ])
                          data = {"ZoneId": zone_id}
                  elif request != "Delete":
                      old = event.get("OldResourceProperties", props)
                      for field in ("ServiceSubnet", "PublicZone", "DnsSuffix"):
                          if props.get(field) != old.get(field):
                              raise ValueError("Keep the installed service subnet, public zone, and private DNS suffix unchanged.")
                      old_token, _, previous_subnet = physical_id.partition(":")
                      if old_token != token:
                          previous_subnet = ""
                      private_test = props.get("PrivateTestArtifacts") == "true"
                      pins = parse_release_pins(props.get("ReleasePins"), os.environ["AWS_REGION"], private_test=private_test)
                      if not private_test and props.get("IncludeStarterCatalog") == "true":
                          pins["WorkspaceStarterCatalog"] = load_starter_catalog(pins)
                      data = resolve_launch(props, boto3.client("ec2", config=config), boto3.client("route53", config=config),
                                            previous_public_subnet=previous_subnet)
                      data.update(pins)
                      selected = data["PublicSubnet"] or previous_subnet
                      physical_id = f"{token}:{selected}" if selected else token
              except ValueError as error:
                  status, reason = cfnresponse.FAILED, str(error)
              except ClientError as error:
                  code = error.response["Error"]["Code"]
                  status, reason = cfnresponse.FAILED, f"AWS launch discovery failed during {error.operation_name} ({code})."
              except Exception:
                  log.exception("AWS launch discovery failed")
                  status, reason = cfnresponse.FAILED, "Launch discovery failed. Check the discovery function logs."
              cfnresponse.send(event, context, status, data, physicalResourceId=physical_id, reason=reason)


          import cfnresponse


          def handler(event, context):
              respond_to_cloudformation(event, context, cfnresponse)
  LaunchDiscovery:
    Type: Custom::ShiftBoxLaunchDiscovery
    Metadata:
      com.aws.cloudformation.Context:
        why: Resolve launch form choices before dependent resources are created.
        must: [Preserve adopted zones and zones with surviving records., Reject malformed or wrong-region release inputs
            before returning image pins.]
    Properties:
      ServiceToken: {'Fn::GetAtt': [DiscoveryFunction, Arn]}
      ServiceTimeout: '180'
      DeploymentName: {Ref: 'AWS::StackName'}
      ServiceSubnet: {Ref: ServiceSubnet}
      WorkspaceSubnet: {Ref: WorkspaceSubnet}
      DnsSuffix: {Ref: DnsSuffix}
      PublicZone: {Ref: PublicDnsZone}
      PublicAccess:
        Fn::If: [PublicEnabled, 'true', 'false']
      ReleasePins: {Ref: ReleasePins}
      PrivateTestArtifacts: {'Fn::If': [PrivateTestArtifacts, 'true', 'false']}
      # Refresh launch discovery when upgrading a stack created by the earlier template.
      IncludeStarterCatalog: 'true'
  PrivateBrowserZone:
    Type: Custom::ShiftBoxPrivateBrowserZone
    Metadata:
      com.aws.cloudformation.Context:
        why: Resolve launch form choices before dependent resources are created.
        must: [Preserve adopted zones and zones with surviving records.]
    Properties:
      ServiceToken: {'Fn::GetAtt': [DiscoveryFunction, Arn]}
      ServiceTimeout: '420'
      DeploymentName: {Ref: 'AWS::StackName'}
      VpcId: {'Fn::GetAtt': [LaunchDiscovery, VpcId]}
      BaseDomain: {'Fn::GetAtt': [LaunchDiscovery, BaseDomain]}

Outputs:
