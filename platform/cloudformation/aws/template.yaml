AWSTemplateFormatVersion: '2010-09-09'
Description: ShiftBox private AWS deployment with reviewed database and controller activation.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Installation}
        Parameters: [DeploymentName, Phase, AvailabilityZone, VpcCidr, DataVolumeSizeGiB, InitializeDataVolume]
      - Label: {default: Private connectivity}
        Parameters: [DnsSuffix, AccessMode, OperatorCidr, CreateNatGateway]
      - Label: {default: Database trust and optional GitHub App}
        Parameters: [PostgresCaPem, GitHubAppSecretArn]
      - Label: {default: Qualification IAM}
        Parameters: [RoleBoundaryMode]

Parameters:
  DeploymentName:
    Type: String
    Default: shiftbox
    AllowedPattern: '[a-z][a-z0-9-]{0,30}[a-z0-9]'
    Description: Unique deployment name in this account and region. Keep it unchanged after installation.
  Phase:
    Type: String
    Default: foundation
    AllowedValues: [foundation, dns-zones, dns-services, database, active]
    Description: Create the foundation, review the private zones and discovery services in separate updates, then start the database and activate the controller.
  RoleBoundaryMode:
    Type: String
    Default: managed
    AllowedValues: [managed, external]
    Description: Use managed for a public installation. External is for qualification with pre-approved run-specific boundaries and a separate setup operator. Keep this mode unchanged after installation.
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for both private subnets, EC2 and installation storage. Keep it unchanged.
  VpcCidr:
    Type: String
    Default: 10.63.0.0/16
    AllowedPattern: '([0-9]{1,3}\.){3}[0-9]{1,3}/(1[6-9]|2[0-4])'
    Description: Nonoverlapping IPv4 CIDR from /16 through /24. A /23 or /24 VPC uses smaller subnets to fit the deployment.
  DnsSuffix:
    Type: String
    MinLength: 4
    MaxLength: 200
    AllowedPattern: '([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?'
    Description: Unique private DNS suffix, kept unchanged after setup. For Tailscale use a unique name under .internal.
  AccessMode:
    Type: String
    Default: tailscale
    AllowedValues: [tailscale, private-link]
    Description: Tailscale subnet router or an existing operator-managed private route and DNS.
  OperatorCidr:
    Type: String
    Default: 192.0.2.255/32
    AllowedPattern: '([0-9]{1,3}\.){3}[0-9]{1,3}/([1-9]|[12][0-9]|3[0-2])'
    Description: Approved operator IPv4 source CIDR when using a private link. Leave the default for Tailscale.
  CreateNatGateway:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Create one outbound NAT gateway. When false, provide existing outbound connectivity before starting services.
  DataVolumeSizeGiB:
    Type: Number
    Default: 32
    MinValue: 20
    MaxValue: 16384
    Description: Size of the retained encrypted installation and database volume.
  InitializeDataVolume:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Permit formatting of the newly created blank installation volume. Use false for an approved host replacement.
  PostgresCaPem:
    Type: String
    Default: ''
    AllowedPattern: '(|-----BEGIN CERTIFICATE-----(\r?\n|\|)[A-Za-z0-9+/=\r\n|]+-----END CERTIFICATE-----[\r\n|]*)'
    Description: Public PostgreSQL CA certificate. For one-line entry use | between PEM lines. Required for database or active phases.
  GitHubAppSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '(|arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+)'
    Description: Optional Secrets Manager ARN containing the operator-owned GitHub App credentials.

Rules:
  PrivateLinkCidrRequired:
    RuleCondition: !Equals [!Ref AccessMode, private-link]
    Assertions:
      - Assert: !Not [!Equals [!Ref OperatorCidr, 192.0.2.255/32]]
        AssertDescription: Enter the source CIDR of the approved private link.
  DatabaseTrustRequired:
    RuleCondition: !Or [!Equals [!Ref Phase, database], !Equals [!Ref Phase, active]]
    Assertions:
      - Assert: !Not [!Equals [!Ref PostgresCaPem, '']]
        AssertDescription: Configure the PostgreSQL certificate/key secret and provide its public CA certificate.

Mappings:
  ReleaseRegions: @@RELEASE_REGIONS@@

Conditions:
  DnsZonesEnabled: !Not [!Equals [!Ref Phase, foundation]]
  DnsServicesEnabled: !Or [!Equals [!Ref Phase, dns-services], !Condition DatabaseEnabled]
  DatabaseEnabled: !Or [!Equals [!Ref Phase, database], !Equals [!Ref Phase, active]]
  ControllerEnabled: !Equals [!Ref Phase, active]
  UseExternalBoundaries: !Equals [!Ref RoleBoundaryMode, external]
  UseManagedBoundaries: !Not [!Condition UseExternalBoundaries]
  UseManagedRouterBoundary: !And [!Condition UseManagedBoundaries, !Condition UseTailnet]
  UseManagedTaskBoundaries: !And [!Condition UseManagedBoundaries, !Condition DatabaseEnabled]
  ManageSetupOperatorPolicy: !And [!Condition UseManagedBoundaries, !Condition DatabaseEnabled]
  # The foundation allows the operator to establish existing outbound routing
  # before the router's bootstrap downloads its packages.
  UseTailnet: !And [!Equals [!Ref AccessMode, tailscale], !Condition DatabaseEnabled]
  UsePrivateLink: !Equals [!Ref AccessMode, private-link]
  UseNat: !Equals [!Ref CreateNatGateway, 'true']
  HasGitHubApp: !Not [!Equals [!Ref GitHubAppSecretArn, '']]
  VpcPrefix23: !Equals [!Select [1, !Split ['/', !Ref VpcCidr]], '23']
  VpcPrefix24: !Equals [!Select [1, !Split ['/', !Ref VpcCidr]], '24']

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  ServiceSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      VpcId: !Ref Vpc
      # Three nonoverlapping subnets need two prefix bits beyond the VPC prefix.
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 3, !If [VpcPrefix24, 6, !If [VpcPrefix23, 7, 8]]]]
      MapPublicIpOnLaunch: false
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  WorkspaceSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 3, !If [VpcPrefix24, 6, !If [VpcPrefix23, 7, 8]]]]
      MapPublicIpOnLaunch: false
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  PrivateRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  ServiceRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ServiceSubnet
      RouteTableId: !Ref PrivateRoutes

  WorkspaceRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WorkspaceSubnet
      RouteTableId: !Ref PrivateRoutes

  # The public subnet contains the outbound NAT gateway only.
  EgressSubnet:
    Type: AWS::EC2::Subnet
    Condition: UseNat
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 3, !If [VpcPrefix24, 6, !If [VpcPrefix23, 7, 8]]]]
      MapPublicIpOnLaunch: false
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  EgressGateway:
    Type: AWS::EC2::InternetGateway
    Condition: UseNat
    Properties:
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  EgressGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: UseNat
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref EgressGateway

  EgressRoutes:
    Type: AWS::EC2::RouteTable
    Condition: UseNat
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  EgressRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: UseNat
    Properties:
      SubnetId: !Ref EgressSubnet
      RouteTableId: !Ref EgressRoutes

  EgressDefaultRoute:
    Type: AWS::EC2::Route
    Condition: UseNat
    DependsOn: EgressGatewayAttachment
    Properties:
      RouteTableId: !Ref EgressRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref EgressGateway

  NatAddress:
    Type: AWS::EC2::EIP
    Condition: UseNat
    DependsOn: EgressGatewayAttachment
    Properties:
      Domain: vpc
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: UseNat
    DependsOn: [EgressDefaultRoute, EgressRouteAssociation]
    Properties:
      ConnectivityType: public
      SubnetId: !Ref EgressSubnet
      AllocationId: !GetAtt NatAddress.AllocationId
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  NatRoute:
    Type: AWS::EC2::Route
    Condition: UseNat
    Properties:
      RouteTableId: !Ref PrivateRoutes
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  HostGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private ECS host with outbound access and no ingress
      VpcId: !Ref Vpc
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  ControllerGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Controller entry for approved operators and the workspace subnet
      VpcId: !Ref Vpc
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  WorkspaceGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private workspaces with outbound access and no ingress
      VpcId: !Ref Vpc
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  SetupGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Setup task with access through the Session Manager tunnel only
      VpcId: !Ref Vpc
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  PostgresGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL reachable only from controller and setup tasks
      VpcId: !Ref Vpc
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  OperatorIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UsePrivateLink
    Properties:
      GroupId: !Ref ControllerGroup
      IpProtocol: tcp
      FromPort: 8443
      ToPort: 8443
      CidrIp: !Ref OperatorCidr

  GuestIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ControllerGroup
      IpProtocol: tcp
      FromPort: 19443
      ToPort: 19447
      SourceSecurityGroupId: !Ref WorkspaceGroup

  PostgresControllerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref PostgresGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ControllerGroup

  PostgresSetupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref PostgresGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref SetupGroup

  InstallationVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Encrypted: true
      Size: !Ref DataVolumeSizeGiB
      VolumeType: gp3
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  # Customer installs create their own boundary policies. The qualification
  # service role instead references policies owned by a separate operator.
  HostRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Condition: UseManagedBoundaries
    Properties:
      Path: !Sub '/shiftbox-boundaries/${AWS::Region}/${DeploymentName}/'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [ec2:DescribeTags, ecs:DiscoverPollEndpoint, ecs:Poll, ecs:StartTelemetrySession]
            Resource: '*'
            Condition: {StringEquals: {'aws:RequestedRegion': !Ref 'AWS::Region'}}
          - Effect: Allow
            Action:
              - ecs:DeregisterContainerInstance
              - ecs:RegisterContainerInstance
              - ecs:SubmitAttachmentStateChanges
              - ecs:SubmitContainerStateChange
              - ecs:SubmitTaskStateChange
            Resource: !GetAtt Cluster.Arn
          - Effect: Allow
            Action: ecs:UpdateContainerInstancesState
            Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:container-instance/${Cluster}/*'
          - Effect: Allow
            Action: ecs:TagResource
            Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:container-instance/${Cluster}/*'
            Condition: {StringEquals: {'ecs:CreateAction': RegisterContainerInstance}}
          - Effect: Allow
            Action: ecs:ListTagsForResource
            Resource:
              - !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${Cluster}/*'
              - !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:container-instance/${Cluster}/*'
          - Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ServicesLogGroup}:log-stream:ecs/*'

  RouterRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Condition: UseManagedRouterBoundary
    Properties:
      Path: !Sub '/shiftbox-boundaries/${AWS::Region}/${DeploymentName}/'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ssm:DescribeAssociation
              - ssm:DescribeDocument
              - ssm:GetDeployablePatchSnapshotForInstance
              - ssm:GetDocument
              - ssm:GetManifest
              - ssm:ListAssociations
              - ssm:ListInstanceAssociations
              - ssm:PutComplianceItems
              - ssm:PutConfigurePackageResult
              - ssm:PutInventory
              - ssm:UpdateAssociationStatus
              - ssm:UpdateInstanceAssociationStatus
              - ssm:UpdateInstanceInformation
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
              - ec2messages:AcknowledgeMessage
              - ec2messages:DeleteMessage
              - ec2messages:FailMessage
              - ec2messages:GetEndpoint
              - ec2messages:GetMessages
              - ec2messages:SendReply
            Resource: '*'
            Condition: {StringEquals: {'aws:RequestedRegion': !Ref 'AWS::Region'}}

  # The bundle renderer copies each task boundary document from the role's
  # inline policy below so the authorization and its ceiling stay in sync.
  PostgresExecutionRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Condition: UseManagedTaskBoundaries
    Properties:
      Path: !Sub '/shiftbox-boundaries/${AWS::Region}/${DeploymentName}/'
      PolicyDocument:
@@POSTGRES_EXECUTION_BOUNDARY_DOCUMENT@@

  SetupExecutionRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Condition: UseManagedTaskBoundaries
    Properties:
      Path: !Sub '/shiftbox-boundaries/${AWS::Region}/${DeploymentName}/'
      PolicyDocument:
@@SETUP_EXECUTION_BOUNDARY_DOCUMENT@@

  ControllerExecutionRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Condition: UseManagedTaskBoundaries
    Properties:
      Path: !Sub '/shiftbox-boundaries/${AWS::Region}/${DeploymentName}/'
      PolicyDocument:
@@CONTROLLER_EXECUTION_BOUNDARY_DOCUMENT@@

  SetupTaskRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Condition: UseManagedTaskBoundaries
    Properties:
      Path: !Sub '/shiftbox-boundaries/${AWS::Region}/${DeploymentName}/'
      PolicyDocument:
@@SETUP_TASK_BOUNDARY_DOCUMENT@@

  ControllerTaskRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Condition: UseManagedTaskBoundaries
    Properties:
      Path: !Sub '/shiftbox-boundaries/${AWS::Region}/${DeploymentName}/'
      PolicyDocument:
@@CONTROLLER_TASK_BOUNDARY_DOCUMENT@@

  HostRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If [UseExternalBoundaries, !Sub '${DeploymentName}-HostRole', !Sub '${DeploymentName}-${AWS::Region}-host']
      Path: !If [UseExternalBoundaries, !Sub '/shiftbox-qualification/${DeploymentName}/', !Sub '/shiftbox/${AWS::Region}/${DeploymentName}/']
      PermissionsBoundary: !If
        - UseExternalBoundaries
        - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/shiftbox-qualification-boundaries/${DeploymentName}-HostRole'
        - !Ref HostRoleBoundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role'
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !If [UseExternalBoundaries, !Sub '${DeploymentName}-HostProfile', !Sub '${DeploymentName}-${AWS::Region}-host']
      Path: !If [UseExternalBoundaries, !Sub '/shiftbox-qualification/${DeploymentName}/', !Sub '/shiftbox/${AWS::Region}/${DeploymentName}/']
      Roles: [!Ref HostRole]

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref DeploymentName
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  EcsHost:
    Type: AWS::EC2::Instance
    DependsOn: ServiceRoutes
    Properties:
      ImageId: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', HostAmi]
      InstanceType: t3.medium
      IamInstanceProfile: !Ref HostProfile
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: false
          DeleteOnTermination: true
          SubnetId: !Ref ServiceSubnet
          GroupSet: [!Ref HostGroup]
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {Encrypted: true, VolumeType: gp3, VolumeSize: 30, DeleteOnTermination: true}
      PropagateTagsToVolumeOnCreation: true
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/sh
            set -eu

            # CloudFormation prepares the managed outbound route first: ${OutboundRoute}
            install -d -m 0755 /etc/ecs /usr/local/libexec
            cat > /etc/ecs/ecs.config <<'AGENT'
            ECS_CLUSTER=${Cluster}
            ECS_CONTAINER_INSTANCE_TAGS={"cluster_name":"${DeploymentName}","project":"shiftbox"}
            ECS_AWSVPC_BLOCK_IMDS=true
            ECS_ENABLE_AWSLOGS_EXECUTIONROLE_OVERRIDE=true
            AGENT

            cat > /usr/local/libexec/shiftbox-mount-data <<'MOUNT_SCRIPT'
            ${MountScript}
            MOUNT_SCRIPT
            chmod 0755 /usr/local/libexec/shiftbox-mount-data
            volume_serial=$(printf '%s' '${InstallationVolume}' | tr -d '-')

            cat > /etc/systemd/system/shiftbox-data.service <<DATA_UNIT
            [Unit]
            Description=Mount the persistent ShiftBox data volume
            After=cloud-final.service
            Before=docker.service ecs.service

            [Service]
            Type=oneshot
            ExecStart=/usr/local/libexec/shiftbox-mount-data $volume_serial /var/lib/shiftbox-data ${InitializeDataVolume}
            RemainAfterExit=yes
            TimeoutStartSec=300
            DATA_UNIT

            for service in docker ecs; do
                install -d -m 0755 "/etc/systemd/system/$service.service.d"
                cat > "/etc/systemd/system/$service.service.d/shiftbox-data.conf" <<'DEPENDENCY'
            [Unit]
            Requires=shiftbox-data.service
            After=shiftbox-data.service
            DEPENDENCY
            done

            systemctl daemon-reload
            systemctl enable --now --no-block ecs.service
          - MountScript: @@MOUNT_DATA_SCRIPT@@
            OutboundRoute: !If [UseNat, !Ref NatRoute, operator-managed]

  DataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref EcsHost
      VolumeId: !Ref InstallationVolume

  RouterRole:
    Type: AWS::IAM::Role
    Condition: UseTailnet
    Properties:
      RoleName: !If [UseExternalBoundaries, !Sub '${DeploymentName}-RouterRole', !Sub '${DeploymentName}-${AWS::Region}-router']
      Path: !If [UseExternalBoundaries, !Sub '/shiftbox-qualification/${DeploymentName}/', !Sub '/shiftbox/${AWS::Region}/${DeploymentName}/']
      PermissionsBoundary: !If
        - UseExternalBoundaries
        - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/shiftbox-qualification-boundaries/${DeploymentName}-RouterRole'
        - !Ref RouterRoleBoundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  RouterProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: UseTailnet
    Properties:
      InstanceProfileName: !If [UseExternalBoundaries, !Sub '${DeploymentName}-RouterProfile', !Sub '${DeploymentName}-${AWS::Region}-router']
      Path: !If [UseExternalBoundaries, !Sub '/shiftbox-qualification/${DeploymentName}/', !Sub '/shiftbox/${AWS::Region}/${DeploymentName}/']
      Roles: [!Ref RouterRole]

  RouterGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: UseTailnet
    Properties:
      GroupDescription: Tailscale router without VPC ingress
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: udp, FromPort: 3478, ToPort: 3478, CidrIp: 0.0.0.0/0}
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  RouterIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseTailnet
    Properties:
      GroupId: !Ref ControllerGroup
      IpProtocol: tcp
      FromPort: 8443
      ToPort: 8443
      SourceSecurityGroupId: !Ref RouterGroup

  RouterBrowserEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: UseTailnet
    Properties:
      GroupId: !Ref RouterGroup
      IpProtocol: tcp
      FromPort: 8443
      ToPort: 8443
      DestinationSecurityGroupId: !Ref ControllerGroup

  TailscaleRouter:
    Type: AWS::EC2::Instance
    Condition: UseTailnet
    DependsOn: ServiceRoutes
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
      InstanceType: t4g.micro
      IamInstanceProfile: !Ref RouterProfile
      SourceDestCheck: false
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: false
          DeleteOnTermination: true
          SubnetId: !Ref ServiceSubnet
          GroupSet: [!Ref RouterGroup]
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {Encrypted: true, VolumeType: gp3, VolumeSize: 8, DeleteOnTermination: true}
      PropagateTagsToVolumeOnCreation: true
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]
      UserData:
        Fn::Base64: !Sub
          - @@TAILSCALE_USER_DATA@@
          - dns_suffix: !Ref DnsSuffix
            subnet_cidr: !GetAtt ServiceSubnet.CidrBlock
            browser_port: '8443'

  PostgresAdminSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !If [UseExternalBoundaries, !Sub '${DeploymentName}-PostgresAdminSecret', !Ref 'AWS::NoValue']
      Description: PostgreSQL initialization owner credential
      GenerateSecretString: {PasswordLength: 40, ExcludePunctuation: true}
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  PostgresAppSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !If [UseExternalBoundaries, !Sub '${DeploymentName}-PostgresAppSecret', !Ref 'AWS::NoValue']
      Description: Scoped PostgreSQL ShiftBox role credential
      GenerateSecretString: {PasswordLength: 40, ExcludePunctuation: true}
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  PostgresDexSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !If [UseExternalBoundaries, !Sub '${DeploymentName}-PostgresDexSecret', !Ref 'AWS::NoValue']
      Description: Scoped PostgreSQL Dex role credential
      GenerateSecretString: {PasswordLength: 40, ExcludePunctuation: true}
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  PostgresTlsSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !If [UseExternalBoundaries, !Sub '${DeploymentName}-PostgresTlsSecret', !Ref 'AWS::NoValue']
      Description: Populate with certificate and private_key JSON values before starting PostgreSQL.
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  DiscoveryNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Condition: DnsZonesEnabled
    Properties:
      Name: !Sub 'services.${DnsSuffix}'
      Vpc: !Ref Vpc
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  PostgresDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Condition: DnsServicesEnabled
    Properties:
      Name: postgres
      DnsConfig:
        NamespaceId: !Ref DiscoveryNamespace
        RoutingPolicy: MULTIVALUE
        DnsRecords: [{Type: A, TTL: 10}]
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  ControllerDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Condition: DnsServicesEnabled
    Properties:
      Name: shiftbox
      DnsConfig:
        NamespaceId: !Ref DiscoveryNamespace
        RoutingPolicy: MULTIVALUE
        DnsRecords: [{Type: A, TTL: 10}]
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  PrivateZone:
    Type: AWS::Route53::HostedZone
    Condition: DnsZonesEnabled
    Properties:
      Name: !Ref DnsSuffix
      VPCs: [{VPCId: !Ref Vpc, VPCRegion: !Ref 'AWS::Region'}]
      HostedZoneTags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  PrivateRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: DatabaseEnabled
    Properties:
      HostedZoneId: !Ref PrivateZone
      RecordSets:
        - {Name: !Sub 'postgres.${DnsSuffix}.', Type: CNAME, TTL: '10', ResourceRecords: [!Sub 'postgres.services.${DnsSuffix}.']}
        - {Name: !Sub 'shiftbox.${DnsSuffix}.', Type: CNAME, TTL: '10', ResourceRecords: [!Sub 'shiftbox.services.${DnsSuffix}.']}
        - {Name: !Sub 'guest.${DnsSuffix}.', Type: CNAME, TTL: '10', ResourceRecords: [!Sub 'shiftbox.services.${DnsSuffix}.']}
        - {Name: !Sub '*.ide.${DnsSuffix}.', Type: CNAME, TTL: '10', ResourceRecords: [!Sub 'shiftbox.services.${DnsSuffix}.']}
        - {Name: !Sub '*.preview.${DnsSuffix}.', Type: CNAME, TTL: '10', ResourceRecords: [!Sub 'shiftbox.services.${DnsSuffix}.']}
        - {Name: !Sub '*.repair.${DnsSuffix}.', Type: CNAME, TTL: '10', ResourceRecords: [!Sub 'shiftbox.services.${DnsSuffix}.']}

  ServicesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/shiftbox/${DeploymentName}/ecs'
      RetentionInDays: 14
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  PostgresExecutionRole:
    Type: AWS::IAM::Role
    Condition: DatabaseEnabled
    Properties:
      RoleName: !If [UseExternalBoundaries, !Sub '${DeploymentName}-PostgresExecutionRole', !Sub '${DeploymentName}-${AWS::Region}-pg-exec']
      Path: !If [UseExternalBoundaries, !Sub '/shiftbox-qualification/${DeploymentName}/', !Sub '/shiftbox/${AWS::Region}/${DeploymentName}/']
      PermissionsBoundary: !If
        - UseExternalBoundaries
        - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/shiftbox-qualification-boundaries/${DeploymentName}-PostgresExecutionRole'
        - !Ref PostgresExecutionRoleBoundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
              ArnLike: {'aws:SourceArn': !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'}
      Policies:
        - PolicyName: ReadPostgresCredentials
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref PostgresAdminSecret, !Ref PostgresAppSecret, !Ref PostgresDexSecret, !Ref PostgresTlsSecret]
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ServicesLogGroup}:log-stream:ecs/postgres/*'
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  SetupExecutionRole:
    Type: AWS::IAM::Role
    Condition: DatabaseEnabled
    Properties:
      RoleName: !If [UseExternalBoundaries, !Sub '${DeploymentName}-SetupExecutionRole', !Sub '${DeploymentName}-${AWS::Region}-setup-exec']
      Path: !If [UseExternalBoundaries, !Sub '/shiftbox-qualification/${DeploymentName}/', !Sub '/shiftbox/${AWS::Region}/${DeploymentName}/']
      PermissionsBoundary: !If
        - UseExternalBoundaries
        - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/shiftbox-qualification-boundaries/${DeploymentName}-SetupExecutionRole'
        - !Ref SetupExecutionRoleBoundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
              ArnLike: {'aws:SourceArn': !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'}
      Policies:
        - PolicyName: ReadSetupCredentials
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref PostgresAppSecret, !Ref PostgresDexSecret]
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ServicesLogGroup}:log-stream:ecs/setup/*'
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  ControllerExecutionRole:
    Type: AWS::IAM::Role
    Condition: DatabaseEnabled
    Properties:
      RoleName: !If [UseExternalBoundaries, !Sub '${DeploymentName}-ControllerExecutionRole', !Sub '${DeploymentName}-${AWS::Region}-ctrl-exec']
      Path: !If [UseExternalBoundaries, !Sub '/shiftbox-qualification/${DeploymentName}/', !Sub '/shiftbox/${AWS::Region}/${DeploymentName}/']
      PermissionsBoundary: !If
        - UseExternalBoundaries
        - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/shiftbox-qualification-boundaries/${DeploymentName}-ControllerExecutionRole'
        - !Ref ControllerExecutionRoleBoundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
              ArnLike: {'aws:SourceArn': !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'}
      Policies:
        - PolicyName: ReadControllerCredentials
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref PostgresAppSecret
                  - !If [HasGitHubApp, !Ref GitHubAppSecretArn, !Ref 'AWS::NoValue']
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ServicesLogGroup}:log-stream:ecs/controller/*'
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  SetupTaskRole:
    Type: AWS::IAM::Role
    Condition: DatabaseEnabled
    Properties:
      RoleName: !If [UseExternalBoundaries, !Sub '${DeploymentName}-SetupTaskRole', !Sub '${DeploymentName}-${AWS::Region}-setup-task']
      Path: !If [UseExternalBoundaries, !Sub '/shiftbox-qualification/${DeploymentName}/', !Sub '/shiftbox/${AWS::Region}/${DeploymentName}/']
      PermissionsBoundary: !If
        - UseExternalBoundaries
        - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/shiftbox-qualification-boundaries/${DeploymentName}-SetupTaskRole'
        - !Ref SetupTaskRoleBoundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
              ArnLike: {'aws:SourceArn': !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'}
      Policies:
        - PolicyName: SessionManagerChannels
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  ControllerTaskRole:
    Type: AWS::IAM::Role
    Condition: DatabaseEnabled
    Properties:
      RoleName: !If [UseExternalBoundaries, !Sub '${DeploymentName}-ControllerTaskRole', !Sub '${DeploymentName}-${AWS::Region}-ctrl-task']
      Path: !If [UseExternalBoundaries, !Sub '/shiftbox-qualification/${DeploymentName}/', !Sub '/shiftbox/${AWS::Region}/${DeploymentName}/']
      PermissionsBoundary: !If
        - UseExternalBoundaries
        - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/shiftbox-qualification-boundaries/${DeploymentName}-ControllerTaskRole'
        - !Ref ControllerTaskRoleBoundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
              ArnLike: {'aws:SourceArn': !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'}
      Policies:
        - PolicyName: OwnedWorkspaces
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ObserveRegionalResources
                Effect: Allow
                Action:
                  - ec2:DescribeImages
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeInstanceTypeOfferings
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVolumes
                  - ec2:DescribeVpcs
                Resource: '*'
                Condition:
                  StringEquals: {'aws:RequestedRegion': !Ref 'AWS::Region'}
              - Sid: LaunchOfficialImage
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub
                  - 'arn:${AWS::Partition}:ec2:${AWS::Region}::image/${ImageId}'
                  - ImageId: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceAmi]
                Condition:
                  StringEquals:
                    'ec2:Owner': !FindInMap [ReleaseRegions, !Ref 'AWS::Region', PublisherAccount]
              - Sid: LaunchInWorkspaceNetwork
                Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${WorkspaceSubnet}'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${WorkspaceGroup}'
              - Sid: LaunchOwnedInstances
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  StringEquals: {'aws:RequestTag/ShiftBoxWorkspaceDeployment': !Ref DeploymentName}
              - Sid: LaunchOwnedEncryptedVolumes
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*'
                Condition:
                  StringEquals: {'aws:RequestTag/ShiftBoxWorkspaceDeployment': !Ref DeploymentName}
                  Bool: {'ec2:Encrypted': 'true'}
              - Sid: LaunchOwnedPrivateInterfaces
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*'
                Condition:
                  StringEquals: {'aws:RequestTag/ShiftBoxWorkspaceDeployment': !Ref DeploymentName}
                  BoolIfExists: {'ec2:AssociatePublicIpAddress': 'false'}
              - Sid: TagOnlyAtLaunch
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*'
                Condition:
                  StringEquals:
                    'ec2:CreateAction': RunInstances
                    'aws:RequestTag/ShiftBoxWorkspaceDeployment': !Ref DeploymentName
              - Sid: ManageOwnedInstances
                Effect: Allow
                Action: [ec2:StartInstances, ec2:StopInstances, ec2:RebootInstances, ec2:TerminateInstances, ec2:DescribeInstanceAttribute]
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  StringEquals: {'aws:ResourceTag/ShiftBoxWorkspaceDeployment': !Ref DeploymentName}
              - Sid: DeliverEnrollment
                Effect: Allow
                Action: ec2:ModifyInstanceAttribute
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  StringEquals:
                    'aws:ResourceTag/ShiftBoxWorkspaceDeployment': !Ref DeploymentName
                    'ec2:Attribute': UserData
              - Sid: RemoveOwnedVolumes
                Effect: Allow
                Action: ec2:DeleteVolume
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*'
                Condition:
                  StringEquals: {'aws:ResourceTag/ShiftBoxWorkspaceDeployment': !Ref DeploymentName}
              - Sid: RemoveOwnedInterfaces
                Effect: Allow
                Action: ec2:DeleteNetworkInterface
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*'
                Condition:
                  StringEquals: {'aws:ResourceTag/ShiftBoxWorkspaceDeployment': !Ref DeploymentName}
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  PostgresTask:
    Type: AWS::ECS::TaskDefinition
    Condition: DatabaseEnabled
    Properties:
      Family: !Sub '${DeploymentName}-postgres'
      RequiresCompatibilities: [EC2]
      NetworkMode: awsvpc
      RuntimePlatform: {OperatingSystemFamily: LINUX, CpuArchitecture: X86_64}
      ExecutionRoleArn: !GetAtt PostgresExecutionRole.Arn
      Volumes:
        - Name: data
          Host: {SourcePath: /var/lib/shiftbox-data/postgres}
      ContainerDefinitions:
        - Name: postgres
          Image: @@POSTGRES_IMAGE@@
          Essential: true
          MemoryReservation: 512
          EntryPoint: [/bin/sh, -ec]
          Command:
            - @@POSTGRES_START_SCRIPT@@
          MountPoints:
            - {SourceVolume: data, ContainerPath: /var/lib/postgresql/data}
          Environment:
            - {Name: PGDATA, Value: /var/lib/postgresql/data/pgdata}
            - {Name: POSTGRES_DB, Value: shiftbox}
          Secrets:
            - {Name: POSTGRES_PASSWORD, ValueFrom: !Ref PostgresAdminSecret}
            - {Name: SHIFTBOX_APP_PASSWORD, ValueFrom: !Ref PostgresAppSecret}
            - {Name: SHIFTBOX_DEX_PASSWORD, ValueFrom: !Ref PostgresDexSecret}
            - {Name: POSTGRES_TLS_CERT, ValueFrom: !Sub '${PostgresTlsSecret}:certificate::'}
            - {Name: POSTGRES_TLS_KEY, ValueFrom: !Sub '${PostgresTlsSecret}:private_key::'}
          HealthCheck:
            Command: [CMD, pg_isready, -h, localhost, -p, '5432', -d, shiftbox]
            Interval: 10
            Retries: 6
            StartPeriod: 30
            Timeout: 5
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ServicesLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: ecs
          PortMappings: [{ContainerPort: 5432, Protocol: tcp}]
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  SetupTask:
    Type: AWS::ECS::TaskDefinition
    Condition: DatabaseEnabled
    Properties:
      Family: !Sub '${DeploymentName}-setup'
      RequiresCompatibilities: [EC2]
      NetworkMode: awsvpc
      RuntimePlatform: {OperatingSystemFamily: LINUX, CpuArchitecture: X86_64}
      ExecutionRoleArn: !GetAtt SetupExecutionRole.Arn
      TaskRoleArn: !GetAtt SetupTaskRole.Arn
      Volumes:
        - Name: installation
          Host: {SourcePath: /var/lib/shiftbox-data/shiftbox}
      ContainerDefinitions:
        - Name: setup
          Image: @@CONTROLLER_IMAGE@@
          Essential: true
          MemoryReservation: 512
          EntryPoint: [/usr/local/bin/shiftbox-cloud]
          Command: [setup]
          LinuxParameters: {InitProcessEnabled: true}
          MountPoints:
            - {SourceVolume: installation, ContainerPath: /var/lib/shiftbox}
          Environment:
            - {Name: SHIFTBOX_DB_HOST, Value: !Sub 'postgres.${DnsSuffix}'}
            - {Name: SHIFTBOX_DB_CA, Value: !Join ["\n", !Split ['|', !Ref PostgresCaPem]]}
            - Name: SHIFTBOX_CLOUD_CONFIG
              Value: !Sub
                - >-
                  {"installationDir":"/var/lib/shiftbox","dataProfile":"postgres","managementOrigin":"https://shiftbox.${DnsSuffix}:8443",
                  "runtime":{"provider":"ec2","ec2":{"accountId":"${AWS::AccountId}","region":"${AWS::Region}",
                  "dataVolumeId":"${InstallationVolume}","subnetId":"${WorkspaceSubnet}","securityGroupId":"${WorkspaceGroup}",
                  "deployment":"${DeploymentName}","environment":"production","officialImage":{"amiId":"${ImageId}",
                  "publisherAccountId":"${ImageOwner}","rootDeviceName":"${RootDevice}","rootSnapshotId":"${Snapshot}",
                  "sourceAmiId":"${SourceAmi}","sourceRegion":"${SourceRegion}","sourceCommit":"${SourceRevision}",
                  "releaseId":"${ImageRelease}","guestRelease":"${GuestRelease}","architecture":"${Architecture}",
                  "minimumDiskGiB":${MinimumDisk},"catalogSha256":"${CatalogSHA256}"}},"browserAddress":":8443",
                  "guestHost":"guest.${DnsSuffix}","enrollmentAddress":":19443","pollAddress":":19444","tunnelAddress":":19445"}}
                - ImageId: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceAmi]
                  ImageOwner: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', PublisherAccount]
                  RootDevice: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceRootDevice]
                  Snapshot: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceSnapshot]
                  SourceAmi: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceSourceAmi]
                  SourceRegion: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceSourceRegion]
                  SourceRevision: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceSourceRevision]
                  ImageRelease: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceRelease]
                  GuestRelease: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', GuestRelease]
                  Architecture: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceArchitecture]
                  MinimumDisk: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceMinimumDiskGiB]
                  CatalogSHA256: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceCatalogSHA256]
          Secrets:
            - {Name: SHIFTBOX_APP_PASSWORD, ValueFrom: !Ref PostgresAppSecret}
            - {Name: SHIFTBOX_DEX_PASSWORD, ValueFrom: !Ref PostgresDexSecret}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ServicesLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: ecs
      Tags:
        - {Key: project, Value: shiftbox}
        - {Key: cluster_name, Value: !Ref DeploymentName}
        - {Key: ShiftBoxBootstrap, Value: !Ref DeploymentName}

  ControllerTask:
    Type: AWS::ECS::TaskDefinition
    Condition: DatabaseEnabled
    Properties:
      Family: !Sub '${DeploymentName}-controller'
      RequiresCompatibilities: [EC2]
      NetworkMode: awsvpc
      RuntimePlatform: {OperatingSystemFamily: LINUX, CpuArchitecture: X86_64}
      ExecutionRoleArn: !GetAtt ControllerExecutionRole.Arn
      TaskRoleArn: !GetAtt ControllerTaskRole.Arn
      Volumes:
        - Name: installation
          Host: {SourcePath: /var/lib/shiftbox-data/shiftbox}
      ContainerDefinitions:
        - Name: controller
          Image: @@CONTROLLER_IMAGE@@
          Essential: true
          MemoryReservation: 512
          EntryPoint: [/usr/local/bin/shiftbox-cloud]
          Command: [serve]
          MountPoints:
            - {SourceVolume: installation, ContainerPath: /var/lib/shiftbox}
          Environment:
            - {Name: SHIFTBOX_DB_HOST, Value: !Sub 'postgres.${DnsSuffix}'}
            - {Name: SHIFTBOX_DB_CA, Value: !Join ["\n", !Split ['|', !Ref PostgresCaPem]]}
            - Name: SHIFTBOX_CLOUD_CONFIG
              Value: !Sub
                - >-
                  {"installationDir":"/var/lib/shiftbox","dataProfile":"postgres","managementOrigin":"https://shiftbox.${DnsSuffix}:8443",
                  "runtime":{"provider":"ec2","ec2":{"accountId":"${AWS::AccountId}","region":"${AWS::Region}",
                  "dataVolumeId":"${InstallationVolume}","subnetId":"${WorkspaceSubnet}","securityGroupId":"${WorkspaceGroup}",
                  "deployment":"${DeploymentName}","environment":"production","officialImage":{"amiId":"${ImageId}",
                  "publisherAccountId":"${ImageOwner}","rootDeviceName":"${RootDevice}","rootSnapshotId":"${Snapshot}",
                  "sourceAmiId":"${SourceAmi}","sourceRegion":"${SourceRegion}","sourceCommit":"${SourceRevision}",
                  "releaseId":"${ImageRelease}","guestRelease":"${GuestRelease}","architecture":"${Architecture}",
                  "minimumDiskGiB":${MinimumDisk},"catalogSha256":"${CatalogSHA256}"}},"browserAddress":":8443",
                  "guestHost":"guest.${DnsSuffix}","enrollmentAddress":":19443","pollAddress":":19444","tunnelAddress":":19445"}}
                - ImageId: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceAmi]
                  ImageOwner: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', PublisherAccount]
                  RootDevice: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceRootDevice]
                  Snapshot: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceSnapshot]
                  SourceAmi: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceSourceAmi]
                  SourceRegion: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceSourceRegion]
                  SourceRevision: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceSourceRevision]
                  ImageRelease: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceRelease]
                  GuestRelease: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', GuestRelease]
                  Architecture: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceArchitecture]
                  MinimumDisk: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceMinimumDiskGiB]
                  CatalogSHA256: !FindInMap [ReleaseRegions, !Ref 'AWS::Region', WorkspaceCatalogSHA256]
          Secrets:
            - {Name: SHIFTBOX_APP_PASSWORD, ValueFrom: !Ref PostgresAppSecret}
            - !If [HasGitHubApp, {Name: SHIFTBOX_GITHUB_APP, ValueFrom: !Ref GitHubAppSecretArn}, !Ref 'AWS::NoValue']
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ServicesLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: ecs
          PortMappings:
            - {ContainerPort: 8443, Protocol: tcp}
            - {ContainerPort: 19443, Protocol: tcp}
            - {ContainerPort: 19444, Protocol: tcp}
            - {ContainerPort: 19445, Protocol: tcp}
            - {ContainerPort: 19446, Protocol: tcp}
            - {ContainerPort: 19447, Protocol: tcp}
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  PostgresService:
    Type: AWS::ECS::Service
    Condition: DatabaseEnabled
    DependsOn: [DataAttachment, PrivateRecords]
    Properties:
      ServiceName: postgres
      Cluster: !Ref Cluster
      LaunchType: EC2
      TaskDefinition: !Ref PostgresTask
      DesiredCount: 1
      DeploymentConfiguration: {MaximumPercent: 100, MinimumHealthyPercent: 0}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref ServiceSubnet]
          SecurityGroups: [!Ref PostgresGroup]
      ServiceRegistries: [{RegistryArn: !GetAtt PostgresDiscovery.Arn}]
      PropagateTags: TASK_DEFINITION
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  ControllerService:
    Type: AWS::ECS::Service
    Condition: DatabaseEnabled
    DependsOn: PostgresService
    Properties:
      ServiceName: controller
      Cluster: !Ref Cluster
      LaunchType: EC2
      TaskDefinition: !Ref ControllerTask
      DesiredCount: !If [ControllerEnabled, 1, 0]
      DeploymentConfiguration: {MaximumPercent: 100, MinimumHealthyPercent: 0}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref ServiceSubnet]
          SecurityGroups: [!Ref ControllerGroup]
      ServiceRegistries: [{RegistryArn: !GetAtt ControllerDiscovery.Arn}]
      PropagateTags: TASK_DEFINITION
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  SetupSession:
    Type: AWS::SSM::Document
    Condition: DatabaseEnabled
    Properties:
      Name: !Sub '${DeploymentName}-SetupPort'
      DocumentType: Session
      DocumentFormat: JSON
      Content:
        schemaVersion: '1.0'
        description: Connect only to the protected ShiftBox setup listener.
        sessionType: Port
        properties:
          portNumber: '8444'
          localPortNumber: '8444'
          type: LocalPortForwarding
      Tags: [{Key: project, Value: shiftbox}, {Key: cluster_name, Value: !Ref DeploymentName}]

  SetupOperatorPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: ManageSetupOperatorPolicy
    Properties:
      Description: Run the reviewed ShiftBox setup task and forward its local HTTPS port.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ecs:RunTask
            Resource: !Ref SetupTask
            Condition:
              ArnEquals: {'ecs:cluster': !GetAtt Cluster.Arn}
              StringEquals: {'aws:RequestTag/ShiftBoxBootstrap': !Ref DeploymentName}
          - Effect: Allow
            Action: ecs:TagResource
            Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${Cluster}/*'
            Condition:
              StringEquals:
                'ecs:CreateAction': RunTask
                'aws:RequestTag/ShiftBoxBootstrap': !Ref DeploymentName
          - Effect: Allow
            Action: iam:PassRole
            Resource: [!GetAtt SetupExecutionRole.Arn, !GetAtt SetupTaskRole.Arn]
            Condition:
              StringEquals: {'iam:PassedToService': ecs-tasks.amazonaws.com}
          - Effect: Allow
            Action: ecs:ListTasks
            Resource: '*'
            Condition:
              ArnEquals: {'ecs:cluster': !GetAtt Cluster.Arn}
          - Effect: Allow
            Action: [ecs:DescribeTasks, ecs:StopTask]
            Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${Cluster}/*'
            Condition:
              StringEquals: {'aws:ResourceTag/ShiftBoxBootstrap': !Ref DeploymentName}
          - Effect: Allow
            Action: ssm:StartSession
            Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${Cluster}/*'
            Condition:
              StringEquals: {'aws:ResourceTag/ShiftBoxBootstrap': !Ref DeploymentName}
              BoolIfExists: {'ssm:SessionDocumentAccessCheck': 'true'}
          - Effect: Allow
            Action: [ssm:StartSession, ssm:GetDocument]
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${SetupSession}'
          - Effect: Allow
            Action: ecs:DescribeServices
            Resource: [!Ref ControllerService, !Ref PostgresService]
          - Effect: Allow
            Action: logs:GetLogEvents
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ServicesLogGroup}:log-stream:ecs/setup/*'

Outputs:
  DeploymentName:
    Value: !Ref DeploymentName
  Phase:
    Value: !Ref Phase
  VpcId:
    Value: !Ref Vpc
  ServiceSubnetId:
    Value: !Ref ServiceSubnet
  WorkspaceSubnetId:
    Value: !Ref WorkspaceSubnet
  WorkspaceSecurityGroupId:
    Value: !Ref WorkspaceGroup
  PrivateRouteTableId:
    Value: !Ref PrivateRoutes
  DnsSuffix:
    Value: !Ref DnsSuffix
  PrivateZoneId:
    Condition: DnsZonesEnabled
    Value: !Ref PrivateZone
  DiscoveryNamespaceId:
    Condition: DnsZonesEnabled
    Value: !Ref DiscoveryNamespace
  DiscoveryHostedZoneId:
    Condition: DnsZonesEnabled
    Value: !GetAtt DiscoveryNamespace.HostedZoneId
  PostgresDiscoveryServiceId:
    Condition: DnsServicesEnabled
    Value: !GetAtt PostgresDiscovery.Id
  ControllerDiscoveryServiceId:
    Condition: DnsServicesEnabled
    Value: !GetAtt ControllerDiscovery.Id
  InstallationVolumeId:
    Value: !Ref InstallationVolume
  PostgresTlsSecretArn:
    Value: !Ref PostgresTlsSecret
  PostgresHostname:
    Value: !Sub 'postgres.${DnsSuffix}'
  SetupOperatorPolicyArn:
    Condition: ManageSetupOperatorPolicy
    Value: !Ref SetupOperatorPolicy
  SetupConfig:
    Condition: DatabaseEnabled
    Value: !Sub
      - >-
        {"account":"${AWS::AccountId}","stack_id":"${AWS::StackId}","region":"${AWS::Region}","cluster":"${Cluster}",
        "task_definition":"${Definition}","subnet":"${ServiceSubnet}","security_group":"${SetupGroup}","document":"${SetupSession}",
        "port":8444,"log_group":"${ServicesLogGroup}","tag":"${DeploymentName}"}
      - Definition: !Ref SetupTask
  ManagementOrigin:
    Condition: ControllerEnabled
    Value: !Sub 'https://shiftbox.${DnsSuffix}:8443'
  TailscaleRouterInstanceId:
    Condition: UseTailnet
    Value: !Ref TailscaleRouter
  TailscaleAdvertisedRoute:
    Condition: UseTailnet
    Value: !GetAtt ServiceSubnet.CidrBlock
