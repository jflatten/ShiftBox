name: Documentation site
"on":
  pull_request:
    paths:
      - 'docs/site/**'
      - 'branding/png/shiftbox-logo-light-1600.png'
      - 'platform/release/manifest.sh'
      - 'platform/release/pages-workflow.test.sh'
      - 'platform/release/tests/distribution-fixture.jq'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'branding/png/shiftbox-logo-light-1600.png'
      - 'platform/release/manifest.sh'
      - 'platform/release/pages-workflow.test.sh'
      - 'platform/release/tests/distribution-fixture.jq'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.14'
          working-directory: docs/site
          bundler-cache: true
      - name: Verify site and publishing boundaries
        if: github.event_name == 'pull_request'
        run: |
          platform/release/pages-workflow.test.sh
          docs/site/tests/site.test.sh
      - name: Build documentation
        env:
          SHIFTBOX_RELEASE_PUBLISHER_ACCOUNT_ID: ${{ vars.SHIFTBOX_RELEASE_PUBLISHER_ACCOUNT_ID }}
        run: docs/site/build.sh "$RUNNER_TEMP/shiftbox-pages"
      - name: Stage site artifact
        if: github.repository == 'jflatten/ShiftBox' && github.ref == 'refs/heads/main' && github.ref_protected && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/shiftbox-pages

  deploy:
    if: github.repository == 'jflatten/ShiftBox' && github.ref == 'refs/heads/main' && github.ref_protected && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
