name: Checks
on:
  pull_request:
  # Release preflight requires a successful run on the exact tag commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fmt-check vet test race
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: go test -tags openapi ./tests/contract -run '^TestOpenAPITypesMatchContract$' -count=1
      - run: make ui-test build
      - run: go test -tags shiftbox_ui ./cmd/shiftbox -run '^TestEmbeddedBrowserAssets$'
  macos-helper:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sh platform/helper/macos/package.test.sh
  aws-release-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Install local CloudFormation verification tools
        shell: bash
        run: |
          tools="$RUNNER_TEMP/shiftbox-cloudformation-tools"
          mkdir -p "$tools/bin"
          python3 -m venv "$tools/python"
          "$tools/python/bin/pip" install cfn-lint==1.61.0 PyYAML==6.0.3 pytest==9.1.1 botocore==1.35.48
          curl --fail --silent --show-error --location --proto '=https' \
            https://github.com/aws-cloudformation/cloudformation-guard/releases/download/3.3.0/cfn-guard-v3-x86_64-ubuntu-latest.tar.gz \
            --output "$tools/guard.tar.gz"
          printf 'cd7559616dc114565da1326c2ad7463a3c91cd1499f335406fff04747218c8ed  %s\n' "$tools/guard.tar.gz" | sha256sum --check
          tar -xzf "$tools/guard.tar.gz" -C "$tools"
          guard=$(find "$tools" -type f -name cfn-guard -print -quit)
          test -x "$guard"
          install "$guard" "$tools/bin/cfn-guard"
          printf '%s\n' "$tools/python/bin" "$tools/bin" >> "$GITHUB_PATH"
      - name: Verify CloudFormation and release fixtures
        shell: bash
        run: |
          cfn-guard test --rules-file platform/cloudformation/aws/shiftbox.guard \
            --test-data platform/cloudformation/aws/tests/guard/template-tests.yaml
          bash platform/release/workflows.test.sh --workflows --aws-tooling
          bash platform/packer/aws/hosted-build.test.sh
          bash platform/packer/aws/release-network.test.sh
          bash platform/packer/aws/recover-release-network.test.sh
          bash platform/packer/aws/release-phase.test.sh
          bash platform/packer/aws/rehearsal.test.sh
          bash platform/packer/aws/public-recipe.test.sh
          python3 platform/packer/aws/eice-socks.test.py
          bash platform/release/release.test.sh
          bash platform/release/promotion-live.test.sh
          bash platform/release/registry.test.sh
          bash platform/release/amis.test.sh
          bash platform/release/templates.test.sh
          bash platform/cloudformation/aws/setup.test.sh
          bash scripts/install-aws.test.sh
      - name: Plan publisher roles and template buckets offline
        run: |
          terraform -chdir=platform/terraform/publisher init -backend=false -lockfile=readonly
          terraform -chdir=platform/terraform/publisher test
      - name: Plan release automation state and roles offline
        run: |
          for root in platform/terraform/publisher/{release-automation,candidate-phase}; do
            terraform -chdir="$root" fmt -check -recursive
            terraform -chdir="$root" init -backend=false -lockfile=readonly
            terraform -chdir="$root" validate
            terraform -chdir="$root" test
          done
      - name: Check the closed and bound Packer rehearsal role offline
        run: |
          root=platform/terraform/publisher/packer-rehearsal
          terraform -chdir="$root" fmt -check -recursive
          terraform -chdir="$root" init -backend=false -lockfile=readonly
          terraform -chdir="$root" test
      - name: Plan the Ohio build network and test expiry offline
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          root=platform/terraform/publisher/ohio-build
          (cd "$root" && zip -q -X expiry.zip expiry.py)
          export TF_VAR_expires_at
          TF_VAR_expires_at=$(date -u -d '+1 hour' +'%Y-%m-%dT%H:%M:%SZ')
          terraform -chdir="$root" fmt -check -recursive
          terraform -chdir="$root" init -backend=false -lockfile=readonly
          terraform -chdir="$root" validate
          terraform -chdir="$root" test
          python -m pytest -q -p no:cacheprovider "$root/tests"
      - name: Exercise AWS qualification offline
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          bash platform/qualification/preflight.test.sh
          bash platform/qualification/deploy.test.sh
          bash platform/qualification/cleanup.test.sh
          python platform/qualification/workflow.test.py
          python -m pytest -q -p no:cacheprovider platform/qualification/test_cost.py
          python -m pytest -q -p no:cacheprovider platform/development
          terraform -chdir=platform/terraform/qualification/execution test
          terraform -chdir=platform/terraform/qualification init -backend=false -lockfile=readonly
          terraform -chdir=platform/terraform/qualification test
  # Browser, database and UTM journeys need configured fixtures. Their Make
  # targets remain explicit release gates, not claimed by these unit jobs.
