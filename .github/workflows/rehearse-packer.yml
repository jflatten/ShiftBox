name: Rehearse private Ohio Packer build
run-name: Ohio Packer rehearsal ${{ inputs.attempt_id }}

on:
  workflow_dispatch:
    inputs:
      attempt_id:
        description: ID of the reviewed, disposable Ohio build network
        required: true
        type: string
      source_commit:
        description: Full reviewed main SHA with passing Checks
        required: true
        type: string

permissions: {}

concurrency:
  group: shiftbox-ohio-packer-rehearsal
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'jflatten/ShiftBox' && github.repository_id == '1457179716' &&
      github.ref == 'refs/heads/main' && github.actor_id == '11561330' &&
      github.triggering_actor == 'jflatten' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    environment: aws-packer-rehearsal
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      REHEARSAL_ATTEMPT: ${{ inputs.attempt_id }}
      REHEARSAL_SOURCE: ${{ inputs.source_commit }}
      REHEARSAL_ROLE_ARN: ${{ vars.SHIFTBOX_PACKER_REHEARSAL_ROLE_ARN }}
      SHIFTBOX_RELEASE_PUBLISHER_ACCOUNT_ID: ${{ vars.SHIFTBOX_RELEASE_PUBLISHER_ACCOUNT_ID }}
      SHIFTBOX_RELEASE_BUILD_NETWORK: ${{ vars.SHIFTBOX_PACKER_REHEARSAL_NETWORK }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the reviewed dispatch before obtaining AWS access
        env:
          GH_TOKEN: ${{ github.token }}
          SHIFTBOX_PACKER_REHEARSAL_ENABLED: ${{ vars.SHIFTBOX_PACKER_REHEARSAL_ENABLED }}
        run: platform/packer/aws/rehearsal.sh validate
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install the same pinned Packer as the release job
        run: |
          test "$(uname -m)" = x86_64
          [[ "$(aws --version)" == aws-cli/2.* ]]
          tools=$(mktemp -d "$RUNNER_TEMP/packer-tools.XXXXXX")
          curl --fail --silent --show-error --location --proto '=https' \
            https://releases.hashicorp.com/packer/1.14.2/packer_1.14.2_linux_amd64.zip \
            --output "$tools/packer.zip"
          printf 'cfefdea4ac580eba7b254ef34d25b756d4961741004e3e701a1476594d13e64a  %s\n' "$tools/packer.zip" |
            sha256sum --check
          unzip -q "$tools/packer.zip" packer -d "$tools"
          "$tools/packer" init platform/packer/aws
          printf '%s\n' "$tools" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        id: aws
        with:
          role-to-assume: ${{ env.REHEARSAL_ROLE_ARN }}
          role-session-name: shiftbox-packer-rehearsal-${{ github.run_id }}-1
          role-duration-seconds: 3600
          aws-region: us-east-2
          allowed-account-ids: ${{ vars.SHIFTBOX_RELEASE_PUBLISHER_ACCOUNT_ID }}
          unset-current-credentials: true
      - name: Verify this attempt has no prior AMI or snapshot
        id: empty
        run: platform/packer/aws/rehearsal.sh empty
      - name: Build and verify the temporary private AMI
        env:
          SHIFTBOX_RELEASE_BUILD_SSH_KEY: ${{ secrets.SHIFTBOX_PACKER_REHEARSAL_SSH_KEY }}
          SHIFTBOX_RELEASE_GUEST_SIGNING_PUBLIC_KEY: ${{ vars.SHIFTBOX_PACKER_REHEARSAL_GUEST_PUBLIC_KEY }}
        run: |
          candidate=$(jq -er '.candidate_tag | select(. == "v1.0.0-rc.1")' <<< "$SHIFTBOX_RELEASE_BUILD_NETWORK")
          result="$RUNNER_TEMP/packer-rehearsal-result.json"
          timeout --signal=TERM --kill-after=30s 40m platform/packer/aws/hosted-build.sh "$candidate" "$GITHUB_SHA" \
            "$SHIFTBOX_RELEASE_PUBLISHER_ACCOUNT_ID" "$result" --rehearsal
          jq -e '.result=="private-rehearsal-built" and .count==1' "$result" >/dev/null
          printf 'Packer verified one private Ohio rehearsal AMI.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Deregister the verified rehearsal AMI and delete its snapshot
        if: always() && steps.aws.outcome == 'success' && steps.empty.outcome == 'success'
        timeout-minutes: 4
        run: platform/packer/aws/rehearsal.sh cleanup
