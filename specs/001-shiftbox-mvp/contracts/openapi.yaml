openapi: 3.1.0
info:
  title: ShiftBox Management API
  version: 0.1.0
  description: >-
    Contract for the static ShiftBox management UI and operator clients. Guest
    polling and provider integration use separate contracts. Protected mutations
    require both the host-only session cookie and X-CSRF-Token.
servers:
  - url: https://{managementHost}/api/v1
    variables:
      managementHost:
        default: shiftbox.example.test
security:
  - sessionCookie: []
tags:
  - name: Setup
  - name: Session
  - name: Workspaces
  - name: Operations
  - name: Templates
  - name: Secrets
  - name: Git
  - name: Administration
  - name: Infrastructure
  - name: Recovery

paths:
  /setup/status:
    get:
      tags: [Setup]
      security: []
      operationId: getSetupStatus
      responses:
        '200':
          description: Current locally reachable setup gate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'

  /setup/administrator:
    post:
      tags: [Setup]
      security: []
      operationId: createInitialAdministrator
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '201':
          description: Restricted administrator created; temporary password is shown once
          content:
            application/json:
              schema:
                type: object
                required: [administratorId, temporaryPassword, operation]
                properties:
                  administratorId: { type: string, format: uuid }
                  temporaryPassword: { type: string, writeOnly: true }
                  operation: { $ref: '#/components/schemas/Operation' }
        default: { $ref: '#/components/responses/Error' }

  /setup/data-profile:
    put:
      tags: [Setup]
      operationId: configureDataProfile
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SQLiteProfileInput'
                - $ref: '#/components/schemas/PostgresProfileInput'
              discriminator:
                propertyName: profile
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        default: { $ref: '#/components/responses/Error' }

  /setup/certificate:
    put:
      tags: [Setup]
      operationId: configureBrowserCertificate
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [certificateChainPem, privateKeyPem, managementOrigin, ideHostPattern, previewHostPattern]
              properties:
                certificateChainPem: { type: string }
                privateKeyPem: { type: string, writeOnly: true }
                managementOrigin: { type: string, format: uri }
                ideHostPattern: { type: string }
                previewHostPattern: { type: string }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        default: { $ref: '#/components/responses/Error' }

  /setup/platform:
    post:
      tags: [Setup]
      operationId: validateSetupPlatform
      description: Verify the local bundle configured by the operator, enroll a disposable UTM clone, confirm cleanup, and select the validated default.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Platform image validated and selected }
        default: { $ref: '#/components/responses/Error' }

  /setup/activate:
    post:
      tags: [Setup]
      operationId: activateInstallation
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        default: { $ref: '#/components/responses/Error' }

  /session:
    get:
      tags: [Session]
      operationId: getSession
      responses:
        '200':
          description: Current principal, permissions, gates, and CSRF token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Session]
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Session revoked }
        default: { $ref: '#/components/responses/Error' }

  /session/password:
    put:
      tags: [Session]
      operationId: changeOwnPassword
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, writeOnly: true }
                newPassword: { type: string, writeOnly: true, minLength: 12 }
      responses:
        '204': { description: Password changed and password-change session gate cleared }
        default: { $ref: '#/components/responses/Error' }

  /session/external-reauthorization:
    post:
      tags: [Session]
      operationId: beginExternalReauthorization
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Short-lived upstream authorization URL bound to the current session
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl, expiresAt]
                properties:
                  authorizationUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }

  /workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      parameters:
        - { name: owner, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { type: string } }
        - name: excludeDeleted
          in: query
          description: Exclude workspaces with confirmed observed state deleted before pagination. In-progress deletion remains visible.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Authorized workspace page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
                  nextCursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Workspaces]
      operationId: launchWorkspace
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [templateId, templateRevision]
              properties:
                templateId: { type: string, format: uuid }
                templateRevision: { type: integer, minimum: 1 }
                name: { type: string, minLength: 1, maxLength: 120 }
                retentionSeconds: { type: [integer, 'null'], minimum: 1 }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        default: { $ref: '#/components/responses/Error' }

  /workspaces/{workspaceId}:
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Authorized workspace detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Workspaces]
      operationId: updateWorkspacePolicy
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                retentionSeconds: { type: [integer, 'null'], minimum: 1 }
                networkPolicyId: { type: string, format: uuid }
                previewPorts:
                  type: array
                  description: Manually configured workspace VM loopback preview ports. An empty array revokes every preview.
                  maxItems: 32
                  uniqueItems: true
                  items: { type: integer, minimum: 1, maximum: 65535 }
      responses:
        '200':
          description: Updated workspace policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        default: { $ref: '#/components/responses/Error' }

  /workspaces/{workspaceId}/actions/{action}:
    post:
      tags: [Workspaces]
      operationId: requestWorkspaceAction
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [start, stop, rebuild, repair, delete, retry, update]
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                confirmDataLoss: { type: boolean, default: false }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        default: { $ref: '#/components/responses/Error' }

  /workspaces/{workspaceId}/entry-grants:
    post:
      tags: [Workspaces]
      operationId: createWorkspaceEntryGrant
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [service]
              properties:
                service: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
      responses:
        '201':
          description: Single-origin, short-lived exchange URL
          content:
            application/json:
              schema:
                type: object
                required: [exchangeUrl, expiresAt]
                properties:
                  exchangeUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }

  /admin/workspaces/{workspaceId}/connection-grants:
    get:
      tags: [Workspaces]
      operationId: listWorkspaceConnectionGrants
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Active administrator connection grants for this workspace
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, email]
                      properties:
                        id: { type: string, format: uuid }
                        email: { type: string, format: email }
        default: { $ref: '#/components/responses/Error' }

  /admin/workspaces/{workspaceId}/connection-grants/{grantId}:
    delete:
      tags: [Workspaces]
      operationId: revokeWorkspaceConnectionGrant
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/CSRFToken'
        - in: path
          name: grantId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Grant revoked and its active connections closed }
        default: { $ref: '#/components/responses/Error' }

  /operations/{operationId}:
    get:
      tags: [Operations]
      operationId: getOperation
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Authorized durable operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        default: { $ref: '#/components/responses/Error' }

  /operations/{operationId}/events:
    get:
      tags: [Operations]
      operationId: streamOperationEvents
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Ordered operation events; event IDs support reconnect replay
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/OperationEvent' }
        '409':
          description: Replay window unavailable; client must refetch operation
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Error' }

  /templates/catalog:
    get:
      tags: [Templates]
      operationId: listTemplateCatalog
      responses:
        '200':
          description: Available resource profile and platform image choices
          content:
            application/json:
              schema:
                type: object
                required: [resourceProfiles, platformImages]
                properties:
                  resourceProfiles: { type: array, items: { $ref: '#/components/schemas/TemplateCatalogChoice' } }
                  platformImages: { type: array, items: { $ref: '#/components/schemas/TemplateCatalogChoice' } }
                  defaultPlatformArtifactId: { type: string, description: The compatible installation default when available }
        default: { $ref: '#/components/responses/Error' }
  /templates:
    get:
      tags: [Templates]
      operationId: listTemplates
      parameters:
        - { name: archived, in: query, schema: { type: boolean, default: false } }
        - name: q
          in: query
          description: Case-insensitive literal search of template name and repository URL, applied before pagination. Maximum 200 UTF-8 bytes.
          schema: { type: string, maxLength: 200 }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Authorized templates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ProjectTemplate' } }
                  nextCursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Templates]
      operationId: createTemplate
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateInput' }
      responses:
        '201':
          description: Template and first immutable revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectTemplate' }
        default: { $ref: '#/components/responses/Error' }

  /templates/{templateId}:
    patch:
      tags: [Templates]
      operationId: updateTemplate
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                state: { type: string, enum: [active, archived] }
      responses:
        '200':
          description: Template identity updated without changing ownership or prior revisions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectTemplate' }
        default: { $ref: '#/components/responses/Error' }

  /templates/{templateId}/revisions:
    post:
      tags: [Templates]
      operationId: createTemplateRevision
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateInput' }
      responses:
        '201':
          description: New immutable revision selected as current
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectTemplate' }
        default: { $ref: '#/components/responses/Error' }
  /templates/{templateId}/grants:
    post:
      tags: [Templates]
      operationId: grantTemplateLaunch
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId, acknowledgeProjectSecretExposure]
              properties:
                userId: { type: string, format: uuid }
                acknowledgeProjectSecretExposure: { const: true }
      responses:
        '204': { description: Launch grant active }
        default: { $ref: '#/components/responses/Error' }

  /templates/{templateId}/grants/{userId}:
    delete:
      tags: [Templates]
      operationId: revokeTemplateLaunch
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Launch and future project-secret retrieval grant revoked }
        default: { $ref: '#/components/responses/Error' }

  /secrets:
    get:
      tags: [Secrets]
      operationId: listSecretMetadata
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [user, template, organization] }
        - name: scopeId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Authorized names, scopes, fallback metadata, and timestamps; never values
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SecretMetadata' }
        default: { $ref: '#/components/responses/Error' }

  /secrets/{scope}/{scopeId}/{name}:
    put:
      tags: [Secrets]
      operationId: setSecret
      parameters:
        - name: scope
          in: path
          required: true
          schema: { type: string, enum: [user, template, organization] }
        - name: scopeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,126}$' }
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value: { type: string, writeOnly: true }
      responses:
        '204': { description: Value stored; it cannot be redisplayed }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Secrets]
      operationId: deleteSecretOverride
      parameters:
        - { name: scope, in: path, required: true, schema: { type: string, enum: [user, template, organization] } }
        - { name: scopeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/CSRFToken'
        - name: X-Acknowledge-Fallback
          in: header
          required: true
          schema: { const: acknowledged }
      responses:
        '204': { description: Override removed after fallback warning acknowledgment }
        default: { $ref: '#/components/responses/Error' }

  /git/authorization:
    get:
      tags: [Git]
      operationId: getGitAuthorization
      responses:
        '200':
          description: Current user's GitHub authorization metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitAuthorizationView' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Git]
      operationId: beginGitAuthorization
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Short-lived GitHub authorization URL bound to current user and state
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl, expiresAt]
                properties:
                  authorizationUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Git]
      operationId: revokeGitAuthorization
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Current user's Git authorization revoked }
        default: { $ref: '#/components/responses/Error' }

  /git/authorization/callback:
    get:
      tags: [Git]
      security: []
      operationId: completeGitAuthorization
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '303':
          description: Authorization recorded for the state-bound user and redirected to management UI
          headers:
            Location: { schema: { type: string, format: uri } }
        default: { $ref: '#/components/responses/Error' }

  /admin/users:
    get:
      tags: [Administration]
      operationId: listUsers
      responses:
        '200':
          description: Organization membership
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/User' } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Administration]
      operationId: createLocalUser
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [member, administrator] }
      responses:
        '201':
          description: Local user and one-time temporary password
          content:
            application/json:
              schema:
                type: object
                required: [user, temporaryPassword]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  temporaryPassword: { type: string, writeOnly: true }
        default: { $ref: '#/components/responses/Error' }

  /admin/users/{userId}:
    patch:
      tags: [Administration]
      operationId: updateMembership
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: { type: string, enum: [member, administrator] }
                membershipState: { type: string, enum: [pending, active, disabled] }
      responses:
        '200':
          description: Updated membership; disabling also starts workspace stop operations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Error' }

  /admin/users/{userId}/password-reset:
    post:
      tags: [Administration]
      operationId: resetLocalUserPassword
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Access revoked and temporary password issued for private one-time delivery
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [user, temporaryPassword]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  temporaryPassword: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /admin/identity/external:
    put:
      tags: [Administration]
      operationId: configureExternalIdentity
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, authorizationIntervalSeconds]
              properties:
                enabled: { type: boolean }
                issuer: { type: [string, 'null'], format: uri }
                connectorId: { type: [string, 'null'] }
                clientId: { type: [string, 'null'] }
                clientSecret: { type: [string, 'null'], writeOnly: true }
                authorizationIntervalSeconds: { type: integer, minimum: 1, default: 14400 }
      responses:
        '204': { description: External connector configuration activated after validation }
        default: { $ref: '#/components/responses/Error' }

  /admin/notices:
    post:
      tags: [Administration]
      operationId: publishNotice
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoticeInput' }
      responses:
        '201':
          description: Published notice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notice' }
        default: { $ref: '#/components/responses/Error' }

  /notices:
    get:
      tags: [Administration]
      operationId: listNotices
      parameters:
        - { name: includeDismissed, in: query, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Current and historical notices authorized for the user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notice' }
        default: { $ref: '#/components/responses/Error' }

  /notices/{noticeId}/receipt:
    patch:
      tags: [Administration]
      operationId: updateNoticeReceipt
      parameters:
        - { name: noticeId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state: { type: string, enum: [read, dismissed] }
      responses:
        '204': { description: Receipt updated; active persistent conditions remain visible }
        default: { $ref: '#/components/responses/Error' }

  /admin/audit:
    get:
      tags: [Administration]
      operationId: listAuditEvents
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: resourceId, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Redacted bounded security-relevant history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }
        default: { $ref: '#/components/responses/Error' }

  /admin/infrastructure:
    get:
      tags: [Infrastructure]
      operationId: getInfrastructureStatus
      responses:
        '200':
          description: Provider, capacity, artifact, certificate, key, storage, and compatibility conditions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfrastructureStatus' }
        default: { $ref: '#/components/responses/Error' }

  /admin/certificate:
    put:
      tags: [Infrastructure]
      operationId: replaceBrowserCertificate
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [certificateChainPem, privateKeyPem]
              properties:
                certificateChainPem: { type: string }
                privateKeyPem: { type: string, writeOnly: true }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        default: { $ref: '#/components/responses/Error' }

  /admin/platform-artifacts:
    post:
      tags: [Infrastructure]
      operationId: importPlatformArtifact
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformArtifactInput' }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        default: { $ref: '#/components/responses/Error' }

  /admin/resource-profiles:
    post:
      tags: [Infrastructure]
      operationId: createResourceProfile
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceProfileInput' }
      responses:
        '201':
          description: Resource profile created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceProfileInput' }
        default: { $ref: '#/components/responses/Error' }

  /admin/capacity:
    put:
      tags: [Infrastructure]
      operationId: updateCapacityBudget
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Resources' }
      responses:
        '204': { description: Capacity budget updated without evicting existing workspaces }
        default: { $ref: '#/components/responses/Error' }

  /admin/network-policies:
    post:
      tags: [Infrastructure]
      operationId: createNetworkPolicy
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkPolicyInput' }
      responses:
        '201':
          description: Policy admitted against current provider capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkPolicyInput' }
        default: { $ref: '#/components/responses/Error' }

  /admin/maintenance:
    get:
      tags: [Infrastructure]
      operationId: listMaintenanceCampaigns
      responses:
        '200':
          description: Current and historical maintenance campaigns
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MaintenanceCampaign' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Infrastructure]
      operationId: createMaintenanceCampaign
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [releaseId, deadline]
              properties:
                releaseId: { type: string }
                deadline: { type: string, format: date-time }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        default: { $ref: '#/components/responses/Error' }

  /admin/migrations/preflight:
    post:
      tags: [Infrastructure]
      operationId: runMigrationPreflight
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [releaseId]
              properties:
                releaseId: { type: string }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        default: { $ref: '#/components/responses/Error' }

  /backups:
    post:
      tags: [Recovery]
      operationId: createBackup
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, destination]
              properties:
                password: { type: string, writeOnly: true, minLength: 12 }
                destination: { type: string, description: Controller-local validated export path }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        default: { $ref: '#/components/responses/Error' }

  /restores/validate:
    post:
      tags: [Recovery]
      operationId: validateRestore
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [archivePath, password]
              properties:
                archivePath: { type: string }
                destination: { type: string, description: Optional absolute replacement directory on the controller }
                password: { type: string, writeOnly: true }
                replacementPostgres:
                  type: object
                  additionalProperties: false
                  required: [profile, tlsMode, connectionUri, dexConnectionUri]
                  properties:
                    profile: { const: postgres }
                    tlsMode: { const: verify-full }
                    connectionUri: { type: string, writeOnly: true }
                    dexConnectionUri: { type: string, writeOnly: true }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        default: { $ref: '#/components/responses/Error' }

  /recovery/{reviewId}:
    get:
      tags: [Recovery]
      operationId: getRecoveryReview
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Current identity, provider, workspace, authorization, and retention review state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryReview' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Recovery]
      operationId: updateRecoveryReview
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [section, decisions]
              properties:
                section: { type: string, enum: [identities, provider, authorization_retention] }
                decisions: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Review evidence recorded; copied authority is not restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryReview' }
        default: { $ref: '#/components/responses/Error' }

  /recovery/{reviewId}/activate:
    post:
      tags: [Recovery]
      operationId: activateRecovery
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-shiftbox_session

  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[0-9]+"$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OperationId:
      name: operationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    OperationAccepted:
      description: Durable operation accepted or existing idempotent operation returned
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Operation' }
    Error:
      description: Stable problem response
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    TemplateCatalogChoice:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    SetupStatus:
      type: object
      required: [state, localOnly, completedSteps, availableSteps]
      properties:
        state: { type: string, enum: [bootstrap, configuring, active, recovery, blocked] }
        localOnly: { type: boolean }
        completedSteps: { type: array, items: { type: string } }
        availableSteps: { type: array, items: { type: string } }
        blockingProblem: { oneOf: [{ $ref: '#/components/schemas/Problem' }, { type: 'null' }] }

    SQLiteProfileInput:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile: { const: sqlite }

    PostgresProfileInput:
      type: object
      additionalProperties: false
      required: [profile, connectionUri, tlsMode]
      properties:
        profile: { const: postgres }
        connectionUri: { type: string, writeOnly: true }
        tlsMode: { type: string, enum: [verify-full] }
        setupConnectionUri: { type: [string, 'null'], writeOnly: true }

    SessionView:
      type: object
      required: [user, mode, csrfToken, permissions, installationState]
      properties:
        user: { $ref: '#/components/schemas/User' }
        mode: { type: string, enum: [bootstrap_restricted, password_change, normal, recovery_review] }
        csrfToken: { type: string, writeOnly: true }
        permissions: { type: array, items: { type: string } }
        installationState: { type: string }
        externalAuthorizationDueAt: { type: [string, 'null'], format: date-time }
        organizationSecretScopeId:
          type: string
          format: uuid
          description: Active organization scope for administrators permitted to manage organization secrets.
        recoveryReviewId:
          type: string
          format: uuid
          description: Current review available to an authenticated recovery administrator.

    User:
      type: object
      required: [id, primaryEmail, role, membershipState, credentialMode, version]
      properties:
        id: { type: string, format: uuid }
        primaryEmail: { type: string, format: email }
        displayName: { type: [string, 'null'] }
        role: { type: string, enum: [member, administrator] }
        membershipState: { type: string, enum: [pending, active, disabled] }
        credentialMode: { type: string, enum: [local, external] }
        mustChangePassword: { type: boolean }
        version: { type: integer, minimum: 1 }

    Workspace:
      type: object
      required: [id, ownerId, templateId, templateRevision, desiredState, observedState, generation, resources, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Workspace display name. Older workspaces display their ID. }
        ownerId: { type: string, format: uuid }
        templateId: { type: string, format: uuid }
        templateRevision: { type: integer, minimum: 1 }
        desiredState: { type: string, enum: [stopped, running, deleted] }
        observedState: { type: string, enum: [unknown, provisioning, stopped, starting, running, unreachable, stopping, deleting, deleted, failed] }
        generation: { type: integer, minimum: 1 }
        resources: { $ref: '#/components/schemas/Resources' }
        currentOperationId: { type: [string, 'null'], format: uuid }
        previewPorts:
          type: array
          items: { type: integer, minimum: 1, maximum: 65535 }
        canOpenPreviews: { type: boolean }
        canEditPreviewPorts: { type: boolean }
        lastActivityAt: { type: [string, 'null'], format: date-time }
        retentionDeadline: { type: [string, 'null'], format: date-time }
        maintenance:
          type: object
          required: [releaseId, deadline, state, operationId]
          properties:
            releaseId: { type: string }
            deadline: { type: string, format: date-time }
            state: { type: string, enum: [pending, waiting_safe, updating, verified, restoring_state, failed] }
            operationId: { type: [string, 'null'], format: uuid }
        failure: { oneOf: [{ $ref: '#/components/schemas/Problem' }, { type: 'null' }] }
        version: { type: integer, minimum: 1 }

    Resources:
      type: object
      required: [cpuCount, memoryMiB, diskMiB]
      properties:
        cpuCount: { type: integer, minimum: 1 }
        memoryMiB: { type: integer, minimum: 1 }
        diskMiB: { type: integer, minimum: 1 }

    Operation:
      type: object
      required: [id, type, status, steps, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: [string, 'null'], format: uuid }
        type: { type: string }
        status: { type: string, enum: [pending, running, waiting, succeeded, failed, cancelled] }
        currentStep: { type: [string, 'null'] }
        steps: { type: array, items: { $ref: '#/components/schemas/OperationStep' } }
        problem: { oneOf: [{ $ref: '#/components/schemas/Problem' }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }

    OperationStep:
      type: object
      required: [key, label, status, index]
      properties:
        key: { type: string }
        label: { type: string }
        index: { type: integer, minimum: 0 }
        status: { type: string, enum: [pending, active, succeeded, failed, skipped] }
        detail: { type: [string, 'null'] }
        problem: { oneOf: [{ $ref: '#/components/schemas/Problem' }, { type: 'null' }] }

    OperationEvent:
      type: object
      required: [eventId, operationId, operationVersion, eventType, occurredAt]
      properties:
        eventId: { type: string }
        operationId: { type: string, format: uuid }
        operationVersion: { type: integer, minimum: 1 }
        eventType: { type: string, enum: [operation.updated, step.updated, authorization.revoked, heartbeat] }
        occurredAt: { type: string, format: date-time }
        operation: { $ref: '#/components/schemas/Operation' }

    ProjectTemplate:
      type: object
      required: [id, ownerId, name, state, currentRevision, repositoryUrl, resourceProfileId, version]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        ownerName: { type: string, description: Current owner display name or email. }
        resourceProfileName: { type: string }
        platformImageName: { type: string }
        name: { type: string }
        state: { type: string, enum: [active, archived] }
        currentRevision: { type: integer, minimum: 1 }
        repositoryUrl: { type: string, format: uri }
        resourceProfileId: { type: string, format: uuid }
        secretNames: { type: array, items: { type: string } }
        launchGrants:
          description: Active launch grants visible only to the template owner and administrators.
          type: array
          items:
            type: object
            required: [userId, email]
            properties:
              userId: { type: string, format: uuid }
              email: { type: string, format: email }
        version: { type: integer, minimum: 1 }

    TemplateInput:
      type: object
      additionalProperties: false
      required: [name, repositoryUrl, resourceProfileId, platformArtifactId]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        repositoryUrl: { type: string, format: uri }
        repositoryRef: { type: [string, 'null'] }
        devcontainerPath: { type: string, default: .devcontainer/devcontainer.json }
        resourceProfileId: { type: string, format: uuid }
        platformArtifactId: { type: string, format: uuid }
        networkPolicyId: { type: [string, 'null'], format: uuid }
        secretNames: { type: array, items: { type: string } }

    SecretMetadata:
      type: object
      required: [scope, scopeId, name, explicitEmpty, updatedAt]
      properties:
        scope: { type: string, enum: [user, template, organization] }
        scopeId: { type: string, format: uuid }
        name: { type: string }
        explicitEmpty: { type: boolean }
        fallbackScope: { type: [string, 'null'], enum: [user, template, organization, null] }
        updatedAt: { type: string, format: date-time }

    GitAuthorizationView:
      type: object
      required: [provider, state, version]
      properties:
        provider: { const: github.com }
        providerUserId: { type: [string, 'null'] }
        state: { type: string, enum: [connected, refreshing, reconnect_required, revoked] }
        accessExpiresAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }

    AuditEvent:
      type: object
      required: [id, occurredAt, actorType, action, resourceType, outcome]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actorType: { type: string, enum: [user, guest, controller, local_recovery] }
        actorId: { type: [string, 'null'] }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: [string, 'null'] }
        outcome: { type: string }
        reasonCode: { type: [string, 'null'] }
        metadata: { type: object, additionalProperties: true, description: Redacted bounded context }

    InfrastructureStatus:
      type: object
      required: [provider, capacity, conditions, version]
      properties:
        provider: { type: object, additionalProperties: true }
        capacity: { $ref: '#/components/schemas/Resources' }
        conditions:
          type: array
          items:
            type: object
            required: [key, severity, active]
            properties:
              key: { type: string }
              severity: { type: string, enum: [info, warning, critical] }
              active: { type: boolean }
              detail: { type: string }
        version: { type: integer, minimum: 1 }

    PlatformArtifactInput:
      type: object
      additionalProperties: false
      required: [folder]
      properties:
        folder:
          type: string
          minLength: 1
          maxLength: 4096
          description: Absolute path on the controller containing the UTM bundle and manifest.json.
        makeDefault: { type: boolean, default: false }

    ResourceProfileInput:
      type: object
      additionalProperties: false
      required: [name, cpuCount, memoryMiB, diskMiB]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        cpuCount: { type: integer, minimum: 1 }
        memoryMiB: { type: integer, minimum: 1 }
        diskMiB: { type: integer, minimum: 1 }

    NetworkPolicyInput:
      type: object
      additionalProperties: false
      required: [name, mode]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        mode: { type: string, enum: [all, no_network, allowlist] }
        rules:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [destination, transport, port]
            properties:
              destination: { type: string }
              transport: { type: string, enum: [tcp, udp] }
              port: { type: integer, minimum: 1, maximum: 65535 }

    MaintenanceCampaign:
      type: object
      required: [id, releaseId, deadline, state, operationId]
      properties:
        id: { type: string, format: uuid }
        releaseId: { type: string }
        deadline: { type: string, format: date-time }
        state: { type: string, enum: [scheduled, active, blocked, completed, cancelled] }
        operationId: { type: string, format: uuid }

    RecoveryReview:
      type: object
      required: [id, state, restoreOperationId, sections, version]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [identity_review, provider_reconcile, authorization_review, ready, activated, blocked] }
        restoreOperationId: { type: string, format: uuid }
        sections:
          type: object
          additionalProperties: true
          properties:
            identities:
              type: array
              description: Restored identities available during identity review.
              items:
                type: object
                required: [id, primaryEmail, role, membershipState, credentialMode]
                properties:
                  id: { type: string, format: uuid }
                  primaryEmail: { type: string, format: email }
                  role: { type: string, enum: [member, administrator] }
                  membershipState: { type: string, enum: [pending, active, disabled] }
                  credentialMode: { type: string, enum: [local, external] }
        version: { type: integer, minimum: 1 }

    NoticeInput:
      type: object
      additionalProperties: false
      required: [severity, title, body]
      properties:
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, minLength: 1, maxLength: 4000 }
        effectiveAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }

    Notice:
      allOf:
        - $ref: '#/components/schemas/NoticeInput'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            readAt: { type: [string, 'null'], format: date-time }
            dismissedAt: { type: [string, 'null'], format: date-time }

    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, pattern: '^[a-z0-9_.-]+$' }
        detail: { type: string }
        requestId: { type: string }
        retryable: { type: boolean, default: false }
        fields:
          type: object
          additionalProperties: { type: string }
