<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #191821; background: #fff; }
    body { margin: 0; line-height: 1.6; }
    a { color: #4834f5; text-underline-offset: .16em; }
    a:focus-visible { outline: 2px solid #4834f5; outline-offset: 3px; }
    header { border-bottom: 1px solid #e0e0e0; }
    .site-header, main { max-width: 54rem; margin: auto; padding: 1rem clamp(1rem, 4vw, 2rem); }
    .site-header, nav { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1rem; }
    .brand img { display: block; }
    main { padding-block: 2rem 4rem; }
    h1, h2, h3 { line-height: 1.25; }
    pre { background: #f4f4f4; overflow: auto; padding: 1rem; }
    table { border-collapse: collapse; display: block; overflow: auto; }
    th, td { border-bottom: 1px solid #e0e0e0; padding: .45rem .7rem; text-align: left; }
    .skip { position: absolute; left: -300vw; }
    .skip:focus { left: 1rem; top: 1rem; padding: .5rem; background: #fff; }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <div class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/shiftbox-logo.png' | relative_url }}" alt="ShiftBox" width="144" height="33"></a>
      <nav aria-label="Documentation">
        <a href="{{ '/install/' | relative_url }}">Install</a>
        <a href="{{ '/private-access/' | relative_url }}">Private access</a>
        <a href="{{ '/first-workspace/' | relative_url }}">First workspace</a>
        <a href="{{ '/troubleshooting/' | relative_url }}">Troubleshoot</a>
        <a href="{{ '/upgrade-recovery/' | relative_url }}">Upgrade and recover</a>
        <a href="{{ '/contributing/' | relative_url }}">Contribute</a>
      </nav>
    </div>
  </header>
  <main id="main">
    {{ content }}
  </main>
</body>
</html>
